# Demo hospital: a synthetic multi-speciality hospital (English, Kannada, Hindi).
# A rollout of the healthcare domain: this file holds only this provider's data. Every name and
# number is invented; none comes from a real hospital. Schedules are weekly templates; dated
# bookings, exceptions and the board come from the demo scenario (`frontdesk-api seed`).
# Category codes are the domain's (packs/healthcare): its symptom routes and department words
# reach whichever of these categories carries the code.

