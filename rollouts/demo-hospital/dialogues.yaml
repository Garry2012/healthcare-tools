# Acceptance lines for the demo hospital: what callers say (as speech-to-text or a speech-to-speech
# model passes it) and what must happen. `frontdesk-api rollout validate` runs every line through
# the resolver and knowledge search with only this rollout's languages on; one mismatch fails it.
# `expect`: OFFER_SLOTS | CLARIFY | TRANSFER_EMERGENCY | TRANSFER_DESK | NO_SERVICE (say), or
# ANSWERED | CLARIFICATION_NEEDED | NO_ANSWER (ask).

# Danger signs: an emergency transfer, in every language and in a mix
- {say: "ಎದೆ ನೋವು ಜಾಸ್ತಿ ಇದೆ", language: kn, expect: TRANSFER_EMERGENCY}
- {say: "ಅಪ್ಪನಿಗೆ chest pain", language: kn, expect: TRANSFER_EMERGENCY}
- {say: "सीने में दर्द हो रहा है", language: hi, expect: TRANSFER_EMERGENCY}
- {say: "seene mein dard", language: hi, expect: TRANSFER_EMERGENCY}
- {say: "stomach pain and vomiting blood", need_text: "stomach pain", expect: TRANSFER_EMERGENCY}
- {say: "khansi mein khoon aa raha hai", language: hi, expect: TRANSFER_EMERGENCY}
- {say: "back pain, cannot move legs", need_text: "back pain", expect: TRANSFER_EMERGENCY}

# Severity or a fall: a person triages
- {say: "severe stomach pain", need_text: "severe stomach pain", expect: TRANSFER_DESK}
- {say: "ತುಂಬಾ ತಲೆ ನೋವು", language: kn, expect: TRANSFER_DESK}

# Departments and symptoms reach the department that carries the domain code
- {say: "pet mein dard hai", language: hi, need_text: "pet mein dard", expect: OFFER_SLOTS, expect_category: cat_genmed}
- {say: "ಹೊಟ್ಟೆ ನೋವು", language: kn, need_text: "ಹೊಟ್ಟೆ ನೋವು", expect: OFFER_SLOTS, expect_category: cat_genmed}
- {say: "I need a children's doctor", language: kn, category: "children's doctor", expect: OFFER_SLOTS, expect_category: cat_paed}
- {say: "ಮಕ್ಕಳ ಡಾಕ್ಟರ್", language: kn, category: "ಮಕ್ಕಳ ಡಾಕ್ಟರ್", expect: OFFER_SLOTS, expect_category: cat_paed}
- {say: "my child has stomach pain", need_text: "my child has stomach pain", expect: CLARIFY}

# Doctors by name, in any script; two Sharmas are never guessed
- {say: "ಡಾಕ್ಟರ್ ಗರಿಮಾ", language: kn, resource_name: "ಡಾಕ್ಟರ್ ಗರಿಮಾ", expect: OFFER_SLOTS, expect_resource: res_garima}
- {say: "डॉक्टर गरिमा", language: hi, resource_name: "डॉक्टर गरिमा", expect: OFFER_SLOTS, expect_resource: res_garima}
- {say: "Garima madam", resource_name: "Garima madam", expect: OFFER_SLOTS, expect_resource: res_garima}
- {say: "Dr Sharma", resource_name: "Dr Sharma", expect: CLARIFY, expect_resource: res_anil_sharma}

# Not a consultation, or not understood: the desk, never "no one is available"
- {say: "I want to talk about my bill", expect: NO_SERVICE}
- {say: "my blood report", expect: TRANSFER_DESK}

# Approved answers, in the caller's language
- {ask: "ಪಾರ್ಕಿಂಗ್ ಇದೆಯಾ", language: kn, expect: ANSWERED, expect_answer: kb_parking}
- {ask: "अस्पताल कहाँ है", language: hi, expect: ANSWERED, expect_answer: kb_location}
- {ask: "hospital kab khulta hai", language: hi, expect: ANSWERED, expect_answer: kb_opd_hours}
- {ask: "visiting hours for ICU", expect: CLARIFICATION_NEEDED}
