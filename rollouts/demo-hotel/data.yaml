# Demo hotel: a synthetic hotel's spa, restaurant and concierge (English, Hindi).
# A rollout of the hospitality domain: this file holds only this provider's data. Every name and
# number is invented.

categories:
  - id: cat_spa
    code: SPA
    name: Spa
    names: {hi: स्पा}
  - id: cat_dining
    code: DINE
    name: Rooftop Restaurant
    names: {hi: रूफ़टॉप रेस्टोरेंट}
  - id: cat_concierge
    code: CONC
    name: Concierge
    names: {hi: कंसीयर्ज}
    bookable: false

resources:
  # Hour-long treatments: a TIMED session, one slot per hour.
  - id: res_asha
    name: Asha
    categories: [cat_spa]
    names: {hi: आशा}
    gender: FEMALE
    attributes: {speciality: Ayurvedic massage}
    price: 3500
    languages: [en, hi]
    sessions:
    - {key: day, label: Spa day, days: [MON, TUE, WED, THU, FRI, SAT, SUN], start: '10:00', end: '18:00', mode: FIXED,
      value: 8, model: TIMED, slot_minutes: 60, reserve: 0}
  - id: res_vikram
    name: Vikram
    categories: [cat_spa]
    names: {hi: विक्रम}
    gender: MALE
    attributes: {speciality: Deep tissue massage}
    price: 3500
    languages: [en, hi]
    sessions:
    - {key: day, label: Spa day, days: [TUE, WED, THU, FRI, SAT, SUN], start: '12:00', end: '20:00', mode: FIXED,
      value: 8, model: TIMED, slot_minutes: 60, reserve: 0}
  # Table reservations: 30-minute seatings, a quarter held back for walk-in diners.
  - id: res_rooftop
    name: Rooftop tables
    categories: [cat_dining]
    names: {hi: रूफ़टॉप टेबल}
    attributes: {cuisine: North Indian grill}
    languages: [en, hi]
    sessions:
    - {key: dinner, label: Dinner, days: [MON, TUE, WED, THU, FRI, SAT, SUN], start: '19:00', end: '23:00', mode: FIXED,
      value: 16, model: TIMED, slot_minutes: 30}
  # Handled by a person: shown, never booked by the agent.
  - id: res_concierge
    name: Concierge desk
    categories: [cat_concierge]
    policy: DESK_ONLY
    languages: [en, hi]

# Local ways callers name this provider's resources (the domain baseline has the rest).
terms:
  - {type: RESOURCE, target: res_asha, term: asha ji, language: en}

knowledge:
  - id: kb_checkout
    topic: stay
    questions:
    - checkout time
    - when is checkout
    - check out kab hai
    - चेकआउट कब है
    answers:
      en: Check-out is at 11 AM. Late check-out until 1 PM can be requested at the front desk.
      hi: चेकआउट सुबह 11 बजे है। दोपहर 1 बजे तक लेट चेकआउट फ्रंट डेस्क पर माँगा जा सकता है।
  - id: kb_breakfast
    topic: dining
    questions:
    - breakfast timings
    - when is breakfast
    - nashta kab hai
    - नाश्ता कब है
    answers:
      en: Breakfast is served from 7 to 10:30 AM in the lobby café.
      hi: नाश्ता सुबह 7 से 10:30 बजे तक लॉबी कैफ़े में मिलता है।
  - id: kb_wifi
    topic: stay
    questions:
    - wifi password
    - is there wifi
    - internet
    - वाईफाई
    answers:
      en: Free Wi-Fi is available everywhere. The network name and password are on your key card sleeve.
      hi: पूरे होटल में मुफ़्त वाई-फ़ाई है। नेटवर्क का नाम और पासवर्ड आपके की-कार्ड कवर पर है।
  - id: kb_pool
    topic: facilities
    questions:
    - pool timings
    - is the pool open
    - swimming pool
    - स्विमिंग पूल
    answers:
      en: The pool is open from 6 AM to 9 PM. Towels are at the pool desk.
      hi: पूल सुबह 6 से रात 9 बजे तक खुला रहता है। तौलिए पूल डेस्क पर मिलते हैं।
  - id: kb_airport
    topic: transport
    questions:
    - airport transfer
    - airport pickup
    - cab to airport
    - एयरपोर्ट
    answers:
      en: Airport transfers can be arranged by the concierge. I will connect you.
    action: TRANSFER_DESK
    destination: concierge
