name: frontdesk-${PROVIDER_ID:-demo-hospital}

# One compose file, two profiles:
#   mcp   : the MCP adapter alone, pointed at the owner services configured in .env
#   stubs : the two development stubs (Manoj contract stub under /api/v1, provisional knowledge stub)
#           for local demos; `make up` runs both profiles with the adapter pointed at the stubs.
# Secrets and ports come from the repository-root .env (the Makefile passes --env-file .env).
# The rollout (a provider's tenant settings) comes from rollouts/$PROVIDER_ID/rollout.env.
# Host ports bind to 127.0.0.1 only. No database, no backend: the owners run their services.

x-provider: &provider
  env_file: ../rollouts/${PROVIDER_ID:-demo-hospital}/rollout.env

services:
  mcp:
    profiles: [mcp, stubs]
    <<: *provider
    build: ../services/mcp
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: "8100"
      OPS_BASE_URL: ${OPS_BASE_URL:-http://ops-stub:8200/api/v1}
      OPS_CLIENT_ID: ${OPS_CLIENT_ID}
      OPS_CLIENT_SECRET: ${OPS_CLIENT_SECRET}
      KNOWLEDGE_BASE_URL: ${KNOWLEDGE_BASE_URL:-http://knowledge-stub:8300}
      KNOWLEDGE_BEARER_TOKEN: ${KNOWLEDGE_BEARER_TOKEN}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}
      MCP_LIFECYCLE_BEARER_TOKEN: ${MCP_LIFECYCLE_BEARER_TOKEN}
      MCP_DEV_CALLER_NUMBER: ${MCP_DEV_CALLER_NUMBER:-}
    ports: ["127.0.0.1:${MCP_HOST_PORT:-8100}:8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

  ops-stub:
    profiles: [stubs]
    build:
      context: ../services/mcp
      dockerfile: dev/Dockerfile
    command: ["python", "-m", "frontdesk_stubs", "--host", "0.0.0.0", "--ops-port", "8200", "--knowledge-port", "8300",
              "--ops-prefix", "/api/v1", "--client-id", "${OPS_CLIENT_ID}", "--client-secret", "${OPS_CLIENT_SECRET}",
              "--knowledge-bearer", "${KNOWLEDGE_BEARER_TOKEN}"]
    ports: ["127.0.0.1:${OPS_STUB_HOST_PORT:-8200}:8200", "127.0.0.1:${KNOWLEDGE_STUB_HOST_PORT:-8300}:8300"]

  # The knowledge stub runs in the same process as the operational stub; this alias keeps the two
  # owner URLs distinct in the adapter's configuration, as they will be in every real deployment.
  knowledge-stub:
    profiles: [stubs]
    image: alpine/socat:1.8.0.0
    command: ["TCP-LISTEN:8300,fork,reuseaddr", "TCP:ops-stub:8300"]
    depends_on: [ops-stub]
