[project]
name = "frontdesk-mcp"
version = "0.1.0"
description = "Thin FastMCP adapter exposing the front-desk Agent operations as two tools"
requires-python = "==3.13.*"
dependencies = [
    "fastmcp==2.14.7",
    "httpx==0.28.1",
    "mcp==1.30.0",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.5",
    "starlette==1.7.0",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pyyaml==6.0.3",
    "ruff==0.16.9",
]

[project.scripts]
frontdesk-mcp = "frontdesk_mcp.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontdesk_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
markers = ["e2e: needs a running frontdesk-api (MCP_E2E_API_URL)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]
