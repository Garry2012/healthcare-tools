[project]
name = "frontdesk-api"
version = "0.1.0"
description = "Front-desk domain REST service: availability, booking, resolver, notifications"
requires-python = "==3.13.*"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "indic-transliteration==2.3.82",
    "metaphone==0.6",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.5",
    "sqlalchemy[asyncio]==2.0.54",
    "starlette==1.7.0",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pyyaml==6.0.3",
    "ruff==0.16.9",
    "schemathesis==4.28.0",
]

[project.scripts]
frontdesk-api = "frontdesk_api.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontdesk_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "postgres: needs the compose test database (TEST_DATABASE_URL / TEST_DATABASE_OWNER_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603"]
"alembic/versions/**" = ["E501", "S608"]  # generated DDL; SQL built from module constants only
