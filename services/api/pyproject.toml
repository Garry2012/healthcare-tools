[project]
name = "frontdesk-api"
version = "0.1.0"
description = "Front-desk domain REST service: availability, booking, resolver, notifications"
requires-python = "==3.13.*"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "indic-transliteration==2.3.82",
    "metaphone==0.6",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.0.54",
    "starlette==1.7.0",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "import-linter==2.15",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "schemathesis==4.28.0",
]

[project.scripts]
frontdesk-api = "frontdesk_api.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontdesk_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
# A hung test dumps every thread's stack instead of stalling CI silently.
faulthandler_timeout = 60
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "postgres: needs the compose test database (TEST_DATABASE_URL / TEST_DATABASE_OWNER_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603"]
"alembic/versions/**" = ["E501", "S608"]  # generated DDL; SQL built from module constants only

# Architecture rules as a build check (CLAUDE.md "rules that the code will not tell you").
[tool.importlinter]
root_package = "frontdesk_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "HTTP layer on top: routers -> services -> db"
type = "layers"
layers = ["frontdesk_api.routers", "frontdesk_api.services", "frontdesk_api.db"]

[[tool.importlinter.contracts]]
name = "Domain logic is pure: no IO, framework or configuration"
type = "forbidden"
source_modules = ["frontdesk_api.domain"]
forbidden_modules = [
    "frontdesk_api.db", "frontdesk_api.services", "frontdesk_api.routers", "frontdesk_api.app",
    "frontdesk_api.config", "frontdesk_api.schemas",
    "fastapi", "starlette", "sqlalchemy", "asyncpg", "httpx",
]

[[tool.importlinter.contracts]]
name = "Core never names a domain pack (packs are loaded by name from configuration)"
type = "forbidden"
source_modules = [
    "frontdesk_api.domain", "frontdesk_api.services", "frontdesk_api.routers", "frontdesk_api.db",
    "frontdesk_api.app", "frontdesk_api.schemas", "frontdesk_api.config", "frontdesk_api.rollouts",
    "frontdesk_api.rollout_cli", "frontdesk_api.seed",
]
forbidden_modules = ["frontdesk_api.packs.healthcare", "frontdesk_api.packs.hospitality"]

[[tool.importlinter.contracts]]
name = "Packs are data: no IO, services or HTTP"
type = "forbidden"
source_modules = ["frontdesk_api.packs"]
forbidden_modules = [
    "frontdesk_api.db", "frontdesk_api.services", "frontdesk_api.routers", "frontdesk_api.app",
    "fastapi", "sqlalchemy", "asyncpg", "httpx",
]

[[tool.importlinter.contracts]]
name = "A domain never knows its rollouts or the demo"
type = "forbidden"
source_modules = ["frontdesk_api.packs"]
forbidden_modules = ["frontdesk_api.rollouts", "frontdesk_api.demo", "frontdesk_api.config"]

[[tool.importlinter.contracts]]
name = "Rollouts are declarative: files, composed and checked, written only by services.rollout_apply"
type = "forbidden"
source_modules = ["frontdesk_api.rollouts"]
forbidden_modules = [
    "frontdesk_api.db", "frontdesk_api.services", "frontdesk_api.routers", "frontdesk_api.app",
    "frontdesk_api.config", "frontdesk_api.demo", "fastapi", "sqlalchemy", "asyncpg", "httpx",
]

[[tool.importlinter.contracts]]
name = "Demo scenarios are reached only through the seed"
type = "forbidden"
source_modules = [
    "frontdesk_api.domain", "frontdesk_api.services", "frontdesk_api.routers", "frontdesk_api.db",
    "frontdesk_api.app", "frontdesk_api.schemas", "frontdesk_api.config", "frontdesk_api.rollouts",
    "frontdesk_api.rollout_cli", "frontdesk_api.locales",
]
forbidden_modules = ["frontdesk_api.demo"]

[[tool.importlinter.contracts]]
name = "Locales are language data only"
type = "forbidden"
source_modules = ["frontdesk_api.locales"]
forbidden_modules = [
    "frontdesk_api.domain", "frontdesk_api.db", "frontdesk_api.services", "frontdesk_api.routers",
    "frontdesk_api.packs", "frontdesk_api.config", "fastapi", "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Domain packs are independent of each other"
type = "independence"
modules = ["frontdesk_api.packs.healthcare", "frontdesk_api.packs.hospitality"]
