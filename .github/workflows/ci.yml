name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Exactly what a reviewer runs on a clean checkout: no database, no owner source, no API virtualenv.
    # Lint, hermetic suites, process-level e2e against the development stubs, package and image builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: "services/mcp/uv.lock"
      - name: All suites
        run: ./scripts/test.sh
