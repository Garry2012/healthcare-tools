              examples:
                confirmedByDesk:
                  summary: Desk confirmed
                  value:
                    id: appt_0192
                    patientName: Ramesh Kumar
                    mobile: '9876543210'
                    doctorId: doc_001
                    visitDate: '2026-10-07'
                    expectedTime: '11:00'
                    reasonVerbatim: knee pain for some time
                    status: CONFIRMED_BY_DESK
                    callId: call_8f2a41
                    createdAt: '2026-10-06T18:40:00+05:30'
                    createdBy: {type: AGENT, id: mcp-gateway}
                    updatedAt: '2026-10-07T09:00:00+05:30'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /appointments/{appointmentId}/informed:
