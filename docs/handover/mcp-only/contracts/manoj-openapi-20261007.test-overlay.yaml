openapi: 3.0.3
info:
  title: Healthcare Operations API
  description: |
    Domain API for the healthcare voice AI operational backend. Consumed by the MCP tool layer (voice agent path) and the front-desk web application. Generic for the healthcare domain: facility-specific values (departments, staleness threshold, session names) are tenant data and configuration, never part of this contract. An appointment is noted, never confirmed - no guaranteed time, slot or token exists in this domain.
    v0.4 (additive): the board is complete every day (usual sessions are pre-filled as NOT_CONFIRMED), staff can read the whole facility, and how a facility talks about availability is CONFIGURATION, not code - see /capabilities. Availability modes: NONE (just come), SESSION (Morning / Evening OPD, first come first served), TIME_WINDOW (expected 10:30-12:00), EXACT_TIME (your appointment is at 11:20), TOKEN (you are token 14), CAPACITY (8 seats left this session), POSITION (5 ahead of you), CALLBACK (the desk calls you back). A hospital enables the modes it supports; a doctor may override the mode; fields a mode needs are optional and empty elsewhere. Capacity slots (opt-in): a session is divided into blocks of N minutes with a seat capacity; every patient in a block is told the block start time - there is still no individual appointment slot.
  version: 0.4.0-draft
  contact: {name: Operational backend workstream}
servers:
- url: https://healthcare-contract-mock.icytree-6543aaa9.centralindia.azurecontainerapps.io
  description: >-
    Contract mock in Azure - always up, listed first so Swagger UI targets it by default. No /api/v1 prefix.
- {url: 'http://localhost:8000/api/v1', description: Local backend (docker-compose.prod.yml or uvicorn)}
- url: http://localhost:4010
  description: >-
    Contract mock (Prism) - deterministic responses from this spec's examples, no backend needed. Prism serves the
    paths exactly as written here, so the mock has no /api/v1 prefix.
- url: https://healthcare-api.icytree-6543aaa9.centralindia.azurecontainerapps.io/api/v1
  description: >-
    Real API in Azure (healthcare-rg) - Medplum-backed doctors, live board, real auth. Needs registered credentials.
tags:
- name: Auth
  description: |
    Token issuance (ADR-003). The backend is the single issuer for every consumer - machine clients exchange client credentials, staff log in with username/password - so no external identity provider is required. Lifetimes are deployment configuration, never fixed in code.
- {name: Doctors, description: Doctor directory and usual schedules (background context only - never today's position)}
- {name: Departments, description: Facility departments with staffing state}
- {name: Availability, description: The live board - the only source for "today" answers}
- {name: Appointments, description: 'The register - requests are noted, never confirmed'}
- {name: Affected Patients, description: Patients impacted by a doctor's schedule change}
- {name: Doctor Messages, description: Inbox of availability messages from doctor channels; never auto-applied}
- name: Admin
  description: |
    Operational data the hospital changes day to day - doctors, departments, staff accounts, machine clients (v0.4). Tenant configuration is NOT an API: it lives in config/tenants/<tenant>.yaml. Every write is audited with the acting user; nothing is hard-deleted (deactivate instead).
- name: Call Summaries
  description: |
    Hospital-facing summary of each agent-handled call, for the admin UI. Summaries only - transcripts, audio and latency traces remain in the voice platform's observability, referenced by callId.
security:
- oauth2: []
- bearerAuth: []
paths:
  /auth/token:
    post:
      tags: [Auth]
      operationId: issueMachineToken
      summary: Machine token (OAuth2 client credentials)
      description: |
        Machine consumers (MCP gateway, channel adapter, voice platform, web application backend) exchange their registered client_id/client_secret for a short-lived bearer token. Scopes are the ones granted at registration - never requested. Unknown id, wrong secret and inactive client all produce the same 401.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/ClientCredentialsGrant'}
      responses:
        '200':
          description: Bearer token issued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
              example: {access_token: eyJhbGciOiJIUzI1NiJ9.example.signature, token_type: Bearer, expires_in: 3600}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: staffLogin
      summary: Staff login (web application)
      description: |
        Front-desk / admin staff sign in with username and password. Returns a short-lived access token (scopes derived from the staff role) and a single-use refresh token. Neutral 401 on any failure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Session established.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
              example: {access_token: eyJhbGciOiJIUzI1NiJ9.example.signature, refresh_token: 0hV3v2mQ7e...single-use...,
                token_type: Bearer, expires_in: 3600, role: desk, username: frontdesk1}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshStaffSession
      summary: Rotate a staff session
      description: |
        Exchanges a refresh token for a new access + refresh pair. Each refresh token is single-use; presenting one twice revokes the whole session family (reuse detection). A deactivated account cannot refresh.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: staffLogout
      summary: End a staff session
      description: Revokes the refresh token's whole family. Idempotent and neutral - always 200.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: Session revoked (or already gone).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '400': {$ref: '#/components/responses/ValidationFailed'}
  /doctors:
    get:
      tags: [Doctors]
      operationId: searchDoctors
      summary: Search the doctor directory
      description: |
        Search by free-text name and/or department. Only active doctors are returned unless active=false is passed explicitly (staff use).
      parameters:
      - name: query
        in: query
        description: Free-text match on doctor name.
        schema: {type: string, maxLength: 100}
      - name: department
        in: query
        description: Department id to filter by.
        schema: {type: string}
      - name: gender
        in: query
        description: Filter by doctor gender (e.g. a caller asking for a lady doctor).
        schema:
          type: string
          enum: [FEMALE, MALE]
      - name: mobile
        in: query
        description: |
          v0.4 (C10) - exact-match lookup for channels: "is this sender a doctor?". Accepts the national 10-digit number or an E.164 / "whatsapp:+91..." form of this facility's country (tenant country_calling_code). Returns 0 or 1 doctor (public summary only - the number itself is never echoed); 400 when the value is not a mobile number of this country.
        schema: {type: string, maxLength: 32}
      - name: active
        in: query
        schema: {type: boolean, default: true}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Matching doctors.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DoctorSummary'}
                  total: {type: integer}
              examples:
                searchByName:
                  summary: query=Sharma - two doctors match (the agent must disambiguate by department)
                  value:
                    items:
                    - id: doc_021
                      name: Dr. Priya Sharma
                      departments:
                      - {id: dept_gynaec, name: Obstetrics & Gynaecology}
                      attendanceType: REGULAR
                      gender: FEMALE
                      qualification: MBBS, DGO
                      languages: [en, kn]
                      active: true
                    - id: doc_022
                      name: Dr. Rakesh Sharma
                      departments:
                      - {id: dept_genmed, name: General Medicine}
                      attendanceType: VISITING
                      gender: MALE
                      qualification: MBBS, MD
                      languages: [en, hi]
                      active: true
                    total: 2
                ladyDoctorInDepartment:
                  summary: department=dept_gynaec&gender=FEMALE - unconfirmed genders never match
                  value:
                    items:
                    - id: doc_001
                      name: Dr. Ambika V
                      departments:
                      - {id: dept_gynaec, name: Obstetrics & Gynaecology}
                      attendanceType: REGULAR
                      gender: FEMALE
                      qualification: MBBS, MS - Obstetrics & Gynaecology
                      consultationFee: {amount: 500, currency: INR}
                      languages: [en, kn, hi]
                      active: true
                    - id: doc_021
                      name: Dr. Priya Sharma
                      departments:
                      - {id: dept_gynaec, name: Obstetrics & Gynaecology}
                      attendanceType: REGULAR
                      gender: FEMALE
                      qualification: MBBS, DGO
                      languages: [en, kn]
                      active: true
                    total: 2
                departmentIncludesUnconfirmedGender:
                  summary: department=dept_genmed without a gender filter - unconfirmed gender appears (no gender
                    field)
                  value:
                    items:
                    - id: doc_006
                      name: Dr. Anil Kamath
                      departments:
                      - {id: dept_genmed, name: General Medicine}
                      attendanceType: REGULAR
                      qualification: MBBS, MCh - Surgical Oncology
                      languages: [en, kn]
                      active: true
                    - id: doc_022
                      name: Dr. Rakesh Sharma
                      departments:
                      - {id: dept_genmed, name: General Medicine}
                      attendanceType: VISITING
                      gender: MALE
                      qualification: MBBS, MD
                      languages: [en, hi]
                      active: true
                    - id: doc_014
                      name: Dr. Rinki Das
                      departments:
                      - {id: dept_genmed, name: General Medicine}
                      attendanceType: ON_CALL
                      gender: FEMALE
                      qualification: MBBS
                      languages: [en, hi]
                      active: true
                    total: 3
                mobileLookup:
                  summary: mobile=+919800000001 - exactly one summary, the number itself is never echoed
                  value:
                    items:
                    - id: doc_001
                      name: Dr. Ambika V
                      departments:
                      - {id: dept_gynaec, name: Obstetrics & Gynaecology}
                      attendanceType: REGULAR
                      gender: FEMALE
                      qualification: MBBS, MS - Obstetrics & Gynaecology
                      consultationFee: {amount: 500, currency: INR}
                      languages: [en, kn, hi]
                      active: true
                    total: 1
                noMatch:
                  summary: query=zzz - empty list, never 404
                  value:
                    items: []
                    total: 0
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /doctors/{doctorId}:
    get:
      tags: [Doctors]
      operationId: getDoctor
      summary: Get a doctor's full profile and usual schedule
      description: |
        The usual schedule (OPD days, sessions, patients-per-hour) is background context only. Consumers must never present it to a caller as today's position - today's position comes exclusively from /availability.
      parameters:
      - {$ref: '#/components/parameters/DoctorId'}
      responses:
        '200':
          description: Doctor detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DoctorDetail'}
              examples:
                regularTwoSessions:
                  summary: Regular doctor, two sessions a day, confirmed data
                  value:
                    id: doc_001
                    name: Dr. Ambika V
                    departments:
                    - {id: dept_gynaec, name: Obstetrics & Gynaecology}
                    attendanceType: REGULAR
                    gender: FEMALE
                    qualification: MBBS, MS - Obstetrics & Gynaecology
                    consultationFee: {amount: 500, currency: INR}
                    languages: [en, kn, hi]
                    active: true
                    patientsPerHour: 6
                    dataConfirmed: true
                    availabilityMode: SESSION
                    usualSchedule:
                    - label: Morning
                      daysOfWeek: [MON, TUE, WED, THU, FRI, SAT]
                      start: '10:30'
                      end: '12:00'
                    - label: Evening
                      daysOfWeek: [MON, TUE, WED, THU, FRI, SAT]
                      start: '18:30'
                      end: '19:30'
                visitingTwoDays:
                  summary: Visiting consultant, one session on two weekdays, data not yet confirmed by the hospital
                  value:
                    id: doc_022
                    name: Dr. Rakesh Sharma
                    departments:
                    - {id: dept_genmed, name: General Medicine}
                    attendanceType: VISITING
                    gender: MALE
                    qualification: MBBS, MD
                    languages: [en, hi]
                    active: true
                    patientsPerHour: 4
                    dataConfirmed: false
                    availabilityMode: SESSION
                    usualSchedule:
                    - label: Afternoon
                      daysOfWeek: [TUE, FRI]
                      start: '15:00'
                      end: '17:00'
                onCallNoSchedule:
                  summary: 'On-call doctor: no usual schedule, the board is the only source (per-doctor mode CALLBACK)'
                  value:
                    id: doc_014
                    name: Dr. Rinki Das
                    departments:
                    - {id: dept_genmed, name: General Medicine}
                    attendanceType: ON_CALL
                    gender: FEMALE
                    qualification: MBBS
                    languages: [en, hi]
                    active: true
                    dataConfirmed: false
                    availabilityMode: CALLBACK
                    usualSchedule: []
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /departments:
    get:
      tags: [Departments]
      operationId: listDepartments
      summary: List the facility's departments
      description: |
        Consumers must not confirm the facility offers a department, or route a caller to it, when hasConsultant is false.
      responses:
        '200':
          description: Department list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Department'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /capabilities:
    get:
      tags: [Availability]
      operationId: getCapabilities
      summary: What this facility can express (v0.4)
      description: |
        Tenant configuration as seen by consumers: which availability modes the hospital supports, whether capacity slots are enabled, the staleness threshold, and how appointments are verified/confirmed. Read once at start-up instead of hard-coding facility behaviour.
      responses:
        '200':
          description: Facility capabilities.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capabilities'}
              examples:
                sessionHospital:
                  summary: This facility (sessions + time windows, 30-minute capacity blocks)
                  value:
                    availability:
                      supportedModes: [SESSION, TIME_WINDOW]
                      defaultMode: SESSION
                      stalenessThresholdHours: 4
                    slots: {enabled: true, blockMinutes: 30}
                    appointments: {verification: MOBILE_MATCH, confirmation: DESK_ONLY}
                tokenHospital:
                  summary: 'Another tenant: tokens + capacity blocks of 20 minutes'
                  value:
                    availability:
                      supportedModes: [SESSION, TOKEN, CAPACITY]
                      defaultMode: TOKEN
                      stalenessThresholdHours: 6
                    slots: {enabled: true, blockMinutes: 20}
                    appointments: {verification: MOBILE_MATCH, confirmation: DESK_ONLY}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /availability:
    get:
      tags: [Availability]
      operationId: getAvailability
      summary: Get the live board for a date
      description: |
        Today's (or a given date's) position for one doctor, a whole department, or (staff only) the whole facility. Give doctorId OR department; give neither for the facility-wide board, which requires a staff scope (availability.write or appointments.staff) - the agent path always asks about one doctor or department. Staleness is computed server-side against the tenant threshold (default 4 hours): a stale entry is returned with status UNKNOWN, and the consumer's behaviour is to hand the caller to a person. A CANCELLED entry never goes stale - a cancellation is a decision for the day, not a position that expires (v0.4).
        Pre-fill (v0.4): a session from the doctor's usual schedule with no desk entry is returned as NOT_CONFIRMED with the usual times - "the doctor is normally here then, nobody has confirmed today". Computed at read time, never stored. A doctor with no usual session that day and no entry returns one UNKNOWN entry. Every entry carries the effective availability `mode` (doctor override or facility default).
        Session ownership rule (v0.4): an appointment's expectedTime belongs to the usual session whose start..end contains it (end inclusive: 12:00 is still the morning's when the morning runs until 12:00); otherwise the next session starting after it; otherwise the last session of the day.
        The board is PER SESSION (v0.3): a doctor with multiple shifts returns one entry per session, each with its own status and staleness clock - consumers must NOT assume one entry per doctor. A morning confirmation is not an evening confirmation. A pre-filled entry stays NOT_CONFIRMED until a staff member confirms it - the agent never treats the usual schedule as today's position.
      parameters:
      - name: date
        in: query
        description: ISO date, or the literal "today" (facility timezone). Defaults to today.
        schema: {type: string, default: today}
      - name: doctorId
        in: query
        schema: {type: string}
      - name: department
        in: query
        schema: {type: string}
      responses:
        '200':
          description: Board entries - one per doctor PER SESSION in scope.
          content:
            application/json:
              schema:
                type: object
                required: [date, items]
                properties:
                  date: {type: string, format: date}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AvailabilityEntry'}
              examples:
                facilityBoardMixedDay:
                  summary: 'Staff view, no filter: every status the agent can meet on one day'
                  value:
                    date: '2026-10-07'
                    items:
                    - {date: '2026-10-07', isStale: false, mode: SESSION, doctorId: doc_001, doctorName: Dr. Ambika
                        V, session: Morning, status: IN, expectedTime: '10:30', expectedEndTime: '12:00', lastUpdatedAt: '2026-10-07T09:05:00+05:30',
                      updatedBy: frontdesk1, source: DESK}
                    - {date: '2026-10-07', isStale: false, mode: SESSION, doctorId: doc_001, doctorName: Dr. Ambika
                        V, session: Evening, status: NOT_CONFIRMED, expectedTime: '18:30', expectedEndTime: '19:30'}
                    - {date: '2026-10-07', isStale: false, mode: SESSION, doctorId: doc_021, doctorName: Dr. Priya
                        Sharma, session: Morning, status: LATE, delayMinutes: 30, expectedTime: '11:00', expectedEndTime: '12:30',
                      note: Traffic delay, lastUpdatedAt: '2026-10-07T10:02:00+05:30', updatedBy: frontdesk1, source: DOCTOR_MESSAGE}
                    - {date: '2026-10-07', isStale: false, mode: SESSION, doctorId: doc_022, doctorName: Dr. Rakesh
                        Sharma, session: Afternoon, status: CANCELLED, note: On leave today, lastUpdatedAt: '2026-10-06T19:40:00+05:30',
                      updatedBy: frontdesk1, source: DESK}
                    - {doctorId: doc_006, doctorName: Dr. Anil Kamath, date: '2026-10-07', session: Afternoon, status: UNKNOWN,
                      isStale: true, lastUpdatedAt: '2026-10-07T04:10:00+05:30', updatedBy: frontdesk1, source: DESK,
                      mode: SESSION}
                    - {doctorId: doc_014, doctorName: Dr. Rinki Das, date: '2026-10-07', status: UNKNOWN, isStale: false,
                      mode: CALLBACK}
                  description: >-
                    IN with a window; pre-filled NOT_CONFIRMED (no updatedBy); LATE from an applied doctor message;
                    CANCELLED (never expires); UNKNOWN stale (entry older than the threshold, times dropped); UNKNOWN
                    with nothing known (no schedule, no entry).
                singleDoctorPrefilled:
                  summary: doctorId=doc_001 before the desk has touched the board
                  value:
                    date: '2026-10-07'
                    items:
                    - {date: '2026-10-07', isStale: false, mode: SESSION, doctorId: doc_001, doctorName: Dr. Ambika
                        V, session: Morning, status: NOT_CONFIRMED, expectedTime: '10:30', expectedEndTime: '12:00'}
                    - {date: '2026-10-07', isStale: false, mode: SESSION, doctorId: doc_001, doctorName: Dr. Ambika
                        V, session: Evening, status: NOT_CONFIRMED, expectedTime: '18:30', expectedEndTime: '19:30'}
                tokenHospital:
                  summary: 'A TOKEN/CAPACITY tenant: the same shape with the extra numbers filled'
                  value:
                    date: '2026-10-07'
                    items:
                    - {doctorId: doc_101, doctorName: Dr. Example, date: '2026-10-07', session: Morning, status: IN,
                      mode: TOKEN, nextToken: 14, remainingCapacity: 8, totalCapacity: 30, isStale: false, lastUpdatedAt: '2026-10-07T09:05:00+05:30',
                      updatedBy: frontdesk1, source: DESK}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /availability/{doctorId}/slots:
    get:
      tags: [Availability]
      operationId: getAvailabilitySlots
      summary: Vacant seats per capacity block (v0.4, opt-in)
      description: |
        For facilities that enable capacity slots: each usual session of the doctor is divided into blocks (blockMinutes, tenant/doctor configuration) with a seat capacity (configured, or derived from the doctor's patientsPerHour). `booked` counts the doctor's active appointments in the block. Every patient booked into a block is told the block START time - there is no individual slot. A CANCELLED session is not bookable; neither is an UNKNOWN (stale) one. Blocks sit on a STABLE grid anchored at the usual session start: a LATE delay (or a later IN expectedTime) does not re-base the grid, it only closes the blocks that end before the delayed start (bookable=false, available=0), so seats booked before the delay are still counted. Appointments without a time count against the first block of the day. For a doctor without a usual schedule that day, a fresh board entry carrying expectedTime/expectedEndTime defines the bookable window. `enabled: false` means this facility does not give out capacity information (session-only) and the list is empty.
        Today, blocks whose end time has already passed are returned with bookable: false; the grid itself never moves. Other dates are not affected by the clock.
      parameters:
      - {$ref: '#/components/parameters/DoctorId'}
      - name: date
        in: query
        schema: {type: string, default: today}
      responses:
        '200':
          description: Capacity blocks per session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlotPlan'}
              examples:
                enabledMorningFillingUp:
                  summary: 'Slots on: first block full, seats left later'
                  value:
                    doctorId: doc_001
                    date: '2026-10-07'
                    enabled: true
                    blockMinutes: 30
                    sessions:
                    - session: Morning
                      status: IN
                      bookable: true
                      slots:
                      - {start: '10:30', end: '11:00', capacity: 3, booked: 3, available: 0, bookable: true}
                      - {start: '11:00', end: '11:30', capacity: 3, booked: 1, available: 2, bookable: true}
                      - {start: '11:30', end: '12:00', capacity: 3, booked: 0, available: 3, bookable: true}
                    - session: Evening
                      status: NOT_CONFIRMED
                      bookable: true
                      slots:
                      - {start: '18:30', end: '19:00', capacity: 3, booked: 0, available: 3, bookable: true}
                      - {start: '19:00', end: '19:30', capacity: 3, booked: 0, available: 3, bookable: true}
                lateClosesPassedBlocks:
                  summary: 'Doctor 30 min LATE: the grid stays, the first block is closed, earlier bookings still
                    counted'
                  value:
                    doctorId: doc_001
                    date: '2026-10-07'
                    enabled: true
                    blockMinutes: 30
                    sessions:
                    - session: Morning
                      status: LATE
                      bookable: true
                      slots:
                      - {start: '10:30', end: '11:00', capacity: 3, booked: 3, available: 0, bookable: false}
                      - {start: '11:00', end: '11:30', capacity: 3, booked: 0, available: 3, bookable: true}
                      - {start: '11:30', end: '12:00', capacity: 3, booked: 0, available: 3, bookable: true}
                morningCancelled:
                  summary: 'Session CANCELLED: blocks shown but none bookable'
                  value:
                    doctorId: doc_001
                    date: '2026-10-07'
                    enabled: true
                    blockMinutes: 30
                    sessions:
                    - session: Morning
                      status: CANCELLED
                      bookable: false
                      slots:
                      - {start: '10:30', end: '11:00', capacity: 3, booked: 2, available: 0, bookable: false}
                      - {start: '11:00', end: '11:30', capacity: 3, booked: 0, available: 0, bookable: false}
                      - {start: '11:30', end: '12:00', capacity: 3, booked: 0, available: 0, bookable: false}
                    - session: Evening
                      status: NOT_CONFIRMED
                      bookable: true
                      slots:
                      - {start: '18:30', end: '19:00', capacity: 3, booked: 0, available: 3, bookable: true}
                      - {start: '19:00', end: '19:30', capacity: 3, booked: 0, available: 3, bookable: true}
                disabled:
                  summary: A hospital that has slots switched off
                  value:
                    doctorId: doc_001
                    date: '2026-10-07'
                    enabled: false
                    blockMinutes: 30
                    sessions: []
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /availability/{doctorId}:
    post:
      tags: [Availability]
      operationId: setAvailability
      summary: Set a doctor's board status (staff only)
      description: |
        Staff-only in Beta - not exposed on the agent path. The write is attributed to the acting staff identity and the source is recorded. One write per session (v0.3): pass the session label when the doctor has multiple shifts; omitting it addresses the doctor's FIRST usual session of that day. expectedEndTime records a limited window (e.g. "today only 15:00-16:00") so the agent can state until when the doctor is available. v0.4: nextToken / remainingCapacity / totalCapacity may be written only when the facility supports the TOKEN / CAPACITY modes; otherwise 400 UNSUPPORTED_CAPABILITY. The desk can only record what the hospital's configured modes can express.
      security:
      - oauth2: [availability.write]
      parameters:
      - {$ref: '#/components/parameters/DoctorId'}
      - {$ref: '#/components/parameters/ActingUser'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AvailabilityUpdate'}
            examples:
              deskMarksIn:
                summary: Doctor has arrived, limited window today
                value: {date: '2026-10-07', session: Morning, status: IN, expectedTime: '10:30', expectedEndTime: '12:00'}
              late30:
                summary: Running late
                value: {date: '2026-10-07', session: Morning, status: LATE, delayMinutes: 30, note: Traffic delay}
              cancelEvening:
                summary: Evening session cancelled
                value: {date: '2026-10-07', session: Evening, status: CANCELLED, note: On leave}
              tokenHospitalUpdate:
                summary: TOKEN/CAPACITY tenant only (400 UNSUPPORTED_CAPABILITY elsewhere)
                value: {date: '2026-10-07', session: Morning, status: IN, nextToken: 14, remainingCapacity: 8, totalCapacity: 30}
      responses:
        '200':
          description: The updated board entry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AvailabilityEntry'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /appointments:
    post:
      tags: [Appointments]
      operationId: createAppointment
      summary: Create an appointment
      description: |
        v0.4, when the facility enables capacity slots and doctorId is given: expectedTime is mapped to its capacity block and the patient is told the block start (returned as slotTime, and expectedTime is set to it); a full block is refused with 409 SLOT_FULL; a time inside a CANCELLED session is refused with 400 (never silently moved); no expectedTime = the first block with a free seat. With slots disabled nothing changes.
        Records the caller's request while they are on the line. Exactly one of doctorId or department must be given. reasonVerbatim must be the caller's own words - never an interpretation or diagnosis. The response status is NOTED: details have been noted, nothing is confirmed.
        A requested time whose block is already closed (passed today, or before a late doctor's start) is placed in the next open block of that session; if the session has no open block left the request is refused with 400.
        A doctor with no usual schedule at all (hours unknown) is noted without a block (no slotTime) until the desk posts hours for that day; a doctor who has hours but not on the requested date is refused with 400.
        When the desk has shortened the session (expectedEndTime), a time after that end is refused with 400; a time before a late start goes to the first open block.
      security:
      - oauth2: [appointments.write]
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentCreate'}
            examples:
              agentNotesVisit:
                summary: Voice agent notes a visit with the caller's words
                value: {patientName: Ramesh Kumar, mobile: '9876543210', doctorId: doc_001, visitDate: '2026-10-07',
                  expectedTime: '11:00', reasonVerbatim: knee pain for some time, callId: call_8f2a41}
              departmentOnly:
                summary: Caller does not know the doctor - department is enough
                value: {patientName: Meena S, mobile: '9988011223', department: dept_gynaec, visitDate: '2026-10-07',
                  reasonVerbatim: pregnancy check-up, callId: call_8f2a42}
              deskWalkIn:
                summary: Desk records a walk-in (no callId)
                value: {patientName: Suresh B, mobile: '9876500003', doctorId: doc_001, visitDate: '2026-10-07',
                  expectedTime: '10:30'}
      responses:
        '201':
          description: The created request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appointment'}
              examples:
                noted:
                  summary: Noted - nothing promised (sessions tenant)
                  value:
                    id: appt_0192
                    patientName: Ramesh Kumar
                    mobile: '9876543210'
                    doctorId: doc_001
                    visitDate: '2026-10-07'
                    expectedTime: '11:00'
                    reasonVerbatim: knee pain for some time
                    status: NOTED
                    callId: call_8f2a41
                    createdAt: '2026-10-06T18:40:00+05:30'
                    createdBy: {type: AGENT, id: mcp-gateway}
                slotAssigned:
                  summary: 'Slots tenant: told the block start, slotTime set'
                  value:
                    id: appt_0192
                    patientName: Ramesh Kumar
                    mobile: '9876543210'
                    doctorId: doc_001
                    visitDate: '2026-10-07'
                    expectedTime: '11:00'
                    reasonVerbatim: knee pain for some time
                    status: NOTED
                    callId: call_8f2a41
                    createdAt: '2026-10-06T18:40:00+05:30'
                    createdBy: {type: AGENT, id: mcp-gateway}
                    slotTime: '11:00'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      tags: [Appointments]
      operationId: findAppointments
      summary: Find appointments by mobile number, or the day roster (staff)
      description: |
        Two uses of one endpoint.
        - With `mobile` (any token): the caller's own requests - a consumer can only ever retrieve requests belonging to the number it presents.
        - Without `mobile` (v0.4, scope `appointments.staff`): the day roster for the desk - every request for one day (`date`, default today), optionally filtered by `doctorId`, `department` (the appointment's department or the doctor's) and `status`, sorted by slot/expected time. An agent token without `mobile` gets 403.
      parameters:
      - name: mobile
        in: query
        required: false
        description: The caller's 10-digit mobile number. Omit (staff scope only) for the day roster.
        schema: {$ref: '#/components/schemas/Mobile'}
      - name: from
        in: query
        description: Earliest visit date (inclusive). Defaults to today.
        schema: {type: string, format: date}
      - name: to
        in: query
        description: Latest visit date (inclusive).
        schema: {type: string, format: date}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/AppointmentStatus'}
      - name: date
        in: query
        description: 'Day roster only: the day to list (YYYY-MM-DD or ''today''). Defaults to today (facility time).'
        schema: {type: string}
      - name: doctorId
        in: query
        description: 'Day roster only: limit to one doctor.'
        schema: {type: string}
      - name: department
        in: query
        description: 'Day roster only: limit to a department (appointment''s or the doctor''s).'
        schema: {type: string}
      responses:
        '200':
          description: Matching requests (may be empty). `total` is the number of items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Appointment'}
                  total: {type: integer, description: Number of items (v0.4).}
              examples:
                callerVisits:
                  summary: mobile=9876543210 - this caller's requests only
                  value:
                    items:
                    - id: appt_0192
                      patientName: Ramesh Kumar
                      mobile: '9876543210'
                      doctorId: doc_001
                      visitDate: '2026-10-07'
                      expectedTime: '11:00'
                      reasonVerbatim: knee pain for some time
                      status: NOTED
                      callId: call_8f2a41
                      createdAt: '2026-10-06T18:40:00+05:30'
                      createdBy: {type: AGENT, id: mcp-gateway}
                    - id: appt_0188
                      patientName: Ramesh Kumar
                      mobile: '9876543210'
                      doctorId: doc_001
                      visitDate: '2026-09-30'
                      expectedTime: '18:30'
                      reasonVerbatim: knee pain for some time
                      status: CANCELLED
                      callId: call_8f2a41
                      createdAt: '2026-10-06T18:40:00+05:30'
                      createdBy: {type: AGENT, id: mcp-gateway}
                    total: 2
                none:
                  summary: No requests for this mobile - empty, never 404
                  value:
                    items: []
                    total: 0
                dayRoster:
                  summary: 'Day roster (staff, no mobile): date=2026-10-07 - every request of the day, sorted by
                    time'
                  value:
                    total: 2
                    items:
                    - id: appt_0192
                      patientName: Ramesh Kumar
                      mobile: '9876543210'
                      doctorId: doc_001
                      visitDate: '2026-10-07'
                      expectedTime: '11:00'
                      slotTime: '11:00'
                      reasonVerbatim: knee pain for some time
                      status: NOTED
                      callId: call_8f2a41
                      createdAt: '2026-10-06T18:40:00+05:30'
                      createdBy: {type: AGENT, id: mcp-gateway}
                    - id: appt_0193
                      patientName: Meena S
                      mobile: '9988011223'
                      doctorId: doc_021
                      visitDate: '2026-10-07'
                      expectedTime: '11:30'
                      slotTime: '11:30'
                      reasonVerbatim: pregnancy check-up
                      status: CONFIRMED_BY_DESK
                      callId: call_8f2a42
                      createdAt: '2026-10-06T19:02:00+05:30'
                      createdBy: {type: AGENT, id: mcp-gateway}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /appointments/{appointmentId}/cancel:
    post:
      tags: [Appointments]
      operationId: cancelAppointment
      summary: Cancel an appointment (mobile-match verified)
      description: |
        Succeeds only when callerMobile matches the mobile on the request. A mismatch returns the same neutral 404 NOT_FOUND as a genuinely absent request - nothing is leaked about whether a request exists under another number. Refused attempts are logged for review. Staff acting through the web application override with their own authorisation (staff scope, callerMobile not required).
      security:
      - oauth2: [appointments.write]
      parameters:
      - {$ref: '#/components/parameters/AppointmentId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [callerMobile]
              properties:
                callerMobile: {$ref: '#/components/schemas/Mobile'}
                reason: {type: string, maxLength: 500, description: 'Optional cancellation reason, caller''s own
                    words.'}
                callId: {$ref: '#/components/schemas/CallId'}
      responses:
        '200':
          description: The cancelled request (status CANCELLED).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appointment'}
              examples:
                cancelled:
                  summary: Cancelled after mobile match
                  value:
                    id: appt_0192
                    patientName: Ramesh Kumar
                    mobile: '9876543210'
                    doctorId: doc_001
                    visitDate: '2026-10-07'
                    expectedTime: '11:00'
                    reasonVerbatim: knee pain for some time
                    status: CANCELLED
                    callId: call_8f2a41
                    createdAt: '2026-10-06T18:40:00+05:30'
                    createdBy: {type: AGENT, id: mcp-gateway}
                    updatedAt: '2026-10-07T08:12:00+05:30'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /appointments/{appointmentId}/reschedule:
    post:
      tags: [Appointments]
      operationId: rescheduleAppointment
      summary: Reschedule an appointment (mobile-match verified)
      description: |
        Same verification and neutral-404 behaviour as cancel. Rescheduling records the new expectation; it does not guarantee any time or token.
        Slots (v0.4, when enabled): the same block check as a new booking - newExpectedTime is mapped to its capacity block on the new date;
        a free seat moves the appointment and sets the new slotTime; a full block is refused with 409 SLOT_FULL and the appointment is left
        unchanged. The appointment's own seat never counts against it (moving within the same block always works). Without
        newExpectedTime the appointment's current time is used on the new date.
      security:
      - oauth2: [appointments.write]
      parameters:
      - {$ref: '#/components/parameters/AppointmentId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [callerMobile, newVisitDate]
              properties:
                callerMobile: {$ref: '#/components/schemas/Mobile'}
                newVisitDate: {type: string, format: date}
                newExpectedTime: {$ref: '#/components/schemas/ApproxTime'}
                callId: {$ref: '#/components/schemas/CallId'}
      responses:
        '200':
          description: The updated request (status CHANGED).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appointment'}
              examples:
                changed:
                  summary: Moved to another day
                  value:
                    id: appt_0192
                    patientName: Ramesh Kumar
                    mobile: '9876543210'
                    doctorId: doc_001
                    visitDate: '2026-10-09'
                    expectedTime: '10:30'
                    reasonVerbatim: knee pain for some time
                    status: CHANGED
                    callId: call_8f2a41
                    createdAt: '2026-10-06T18:40:00+05:30'
                    createdBy: {type: AGENT, id: mcp-gateway}
                    updatedAt: '2026-10-07T08:15:00+05:30'
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /appointments/{appointmentId}/confirm:
    post:
      tags: [Appointments]
      operationId: confirmAppointment
