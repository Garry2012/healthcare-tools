  /doctors/{doctorId}/affected-patients:
    get:
      tags: [Affected Patients]
      operationId: getAffectedPatients
      summary: List patients registered with one doctor on a date
      description: |
        Appointments registered for the doctor on the given date, each with its informed state, plus one overall board status for the doctor. Kept from v0.3; the desk's "who to call" view is /affected-patients (v0.4), which already applies the LATE/CANCELLED rule per session.
      security:
      - oauth2: [appointments.staff]
      parameters:
