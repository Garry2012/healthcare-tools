      security:
      - oauth2: [admin]
      parameters:
      - name: active
        in: query
        description: Omit for all; true/false to filter.
        schema: {type: boolean}
      responses:
        '200':
          description: Doctors with full detail (mobile included for admins).
          content:
            application/json:
