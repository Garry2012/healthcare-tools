        '404': {$ref: '#/components/responses/NotFound'}
  /affected-patients:
    get:
      tags: [Affected Patients]
      operationId: listAffectedPatients
      summary: Patients the desk must call today, across all doctors (v0.4)
      description: |
        Facility-wide list for the desk: every active appointment (NOTED, CONFIRMED_BY_DESK, CHANGED) whose doctor's session is LATE or CANCELLED on the date, each row joined with that session's board state so the screen needs no second lookup. An appointment belongs to the usual session owning its expectedTime (the session-ownership rule, end inclusive; no time = the first session of the day; a doctor without a usual schedule uses their single board entry). IN, NOT_CONFIRMED and UNKNOWN sessions are not "affected" - there is nothing to tell the patient yet. Cancelled appointments are never listed. Sorted by doctor, session, time.
      security:
      - oauth2: [appointments.staff]
      parameters:
      - name: date
        in: query
        schema: {type: string, default: today}
      - name: doctorId
        in: query
        schema: {type: string}
      - name: department
        in: query
        schema: {type: string}
      - name: informed
        in: query
        description: true = already informed, false = still to call; omitted = both.
        schema: {type: boolean}
      responses:
        '200':
          description: Affected appointments with board detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AffectedPatientList'}
              examples:
                lateAndCancelled:
                  summary: 'Two doctors affected today: one LATE (one patient already informed), one CANCELLED'
                  value:
                    date: '2026-10-07'
                    total: 3
                    toInform: 2
