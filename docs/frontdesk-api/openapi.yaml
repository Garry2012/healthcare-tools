# =============================================================================
# Healthcare Front-Desk Operations API — designed from the voice agent inwards
# =============================================================================
#
# WHO THIS FILE IS FOR
#   1. The backend implementer (Python/Node + a database). Every path, schema,
#      rule and error you need is here. Comments marked RULE are behaviour the
#      server MUST implement; comments marked WHY explain the domain reason.
#   2. The MCP builder (FastMCP 2.14.x server, registered into the IBM
#      ContextForge fork as an MCP gateway). Only operations tagged `Agent`
#      become tools. Each carries an `x-mcp` block saying how. The mapping
#      between MCP tools and REST operations is in `x-mcp-tools` at the root.
#
# THE DOMAIN IN FOUR SENTENCES
#   A doctor has a SCHEDULE TEMPLATE (recurring sessions: "Mon/Thu/Fri 09:00-12:00
#   and 15:00-17:00"). Reality differs from the template through SCHEDULE
#   EXCEPTIONS (leave, surgery, conference, extra session — known in advance or
#   on the day) and, on the day itself, the LIVE BOARD (arrived, late, left).
#   AVAILABILITY is never written: it is computed = template ⊕ exceptions ⊕ board
#   ⊕ existing bookings, materialised into SESSION INSTANCES that contain SLOTS.
#   An APPOINTMENT reserves exactly one slot; when a session is cancelled the
#   appointments in it are the IMPACTED PATIENTS the hospital must notify.
#
# TODAY VS FUTURE
#   Same endpoint, same shape. The only difference: today's sessions also carry
#   live-board facts (presence, delay). A future session simply has presence=null.
#   The agent never chooses between a "today" tool and a "future" tool.
#
# MULTILINGUAL
#   The caller speaks English, Kannada, Hindi or anything else; STT may deliver
#   native script, romanised text or an English translation, with proper nouns
#   mangled ("zoologist" for urologist). RULE: the agent passes the caller's
#   words verbatim plus a language hint; the SERVER resolves them against the
#   LEXICON (approved multilingual terms) with transliteration + phonetic +
#   semantic matching and answers with candidates and confidence. Aliases alone
#   are not the solution; they are one input to the resolver. Responses carry
#   `localizedNames` so the agent can speak the hospital's approved wording in
#   the caller's language.
#
# CONVENTIONS
#   Base path /api/v1. JSON. Timestamps ISO 8601 with offset. Dates facility-local.
#   Tenant (facility) bound to the credential, never in the URL.
#   Agent calls carry X-Call-Id and X-Caller-Number headers, injected by the MCP
#   layer from trusted call context — never accepted from the model.
#   POST accepts Idempotency-Key; replay returns 200 + Idempotent-Replay: true.
#   Every example is synthetic. "Dr. Garima" is the worked example from the brief.
# =============================================================================

openapi: 3.0.3
info:
  title: Healthcare Front-Desk Operations API
  version: 1.0.0-draft
  description: >
    Domain API for a hospital front-desk voice agent and the front-desk web
    application. Designed so that a conversational LLM needs at most two tools:
    one to find availability, one to manage an appointment. All business rules
    live here, never in the MCP layer or the prompt.
  contact:
    name: Healthcare tools workstream

servers:
  - url: https://{environment}.example-product.com/api/v1
    variables:
      environment:
        default: beta

tags:
  - name: Agent
    description: >
      The voice-agent facade. Free text in, computed facts out. These five
      operations are the only ones exposed as MCP tools.
  - name: Directory
    description: Doctors, departments, and the multilingual lexicon.
  - name: Scheduling
    description: Schedule templates (the plan), schedule exceptions (reality), live board (right now).
  - name: Availability
    description: Computed, read-only. Session instances with slots, for staff and web.
  - name: Appointments
    description: Staff-side appointment operations and impacted-patient handling.
  - name: Notifications
    description: Outbound notification queue for impacted patients (SMS/call later).
  - name: Calls
    description: Call summaries for the admin UI.

security:
  - oauth2: []

# -----------------------------------------------------------------------------
# MCP TOOL MAPPING (read by the MCP builder; ignored by the REST server)
# -----------------------------------------------------------------------------
# Two tools. Both are thin wrappers over `Agent` operations. The wrapper adds
# nothing but: header injection from call context, an outcome envelope that is
# already the REST response, and stripping of the injected headers from the
# tool's input schema.
x-mcp-tools:
  find_availability:
    description: >
      Find which doctors can be seen and when. Give the caller's words for the
      doctor, department or problem exactly as spoken, and when they want to
      come. Returns understood meaning, bookable slots with times, fee, and
      what to do next (offer slots, ask a clarifying question, or transfer).
    operations:
      - operationId: agentAvailabilitySearch
    inputs_from_context: [X-Call-Id, X-Caller-Number]
  manage_appointment:
    description: >
      Book, list, cancel or reschedule an appointment for the caller. Book uses a
      slotId from find_availability. List/cancel/reschedule are checked against
      the caller's phone number and the patient's name.
    operations:
      - { action: BOOK, operationId: agentBookAppointment }
      - { action: LIST, operationId: agentListAppointments }
      - { action: CANCEL, operationId: agentCancelAppointment }
      - { action: RESCHEDULE, operationId: agentRescheduleAppointment }
    inputs_from_context: [X-Call-Id, X-Caller-Number]
  alternative_one_to_one:
    note: >
      FastMCP.from_openapi with a RouteMap selecting tag=Agent yields five tools
      (one per Agent operation) with no hand-written code. Acceptable, but the
      two-tool wrapper above is preferred for a small conversational model.

paths:

  # ===========================================================================
  # AGENT FACADE — the only surface the LLM sees
  # ===========================================================================

  /agent/availability-search:
    post:
      tags: [Agent]
      operationId: agentAvailabilitySearch
      summary: Find doctors, sessions and bookable slots from the caller's own words
      description: >
        The single discovery call. Accepts any combination of doctor name,
        department, symptom text and time preference, all as spoken.
        RULE: run the safety check first (tenant red-flag lexicon); if it fires,
        return routing.action=TRANSFER_EMERGENCY and nothing else.
        RULE: resolve identity over the whole directory before applying any
        date or availability filter, so ambiguity survives.
        RULE: never return an empty list for a failure; set outcome=COULD_NOT_CHECK.
        RULE: resolve relative time words ("tomorrow", "next Tuesday", "evening")
        server-side in the facility timezone; the LLM must not do calendar math.
      x-mcp:
        expose: true
        tool: find_availability
        inject_headers: [X-Call-Id, X-Caller-Number]
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallerNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilitySearchRequest' }
            examples:
              namedDoctorTomorrowEvening:
                summary: Named doctor, relative date, day part, spoken in Kannada
                value:
                  utterance: "ನಾಳೆ ಸಂಜೆ ಡಾಕ್ಟರ್ ಗರಿಮಾ ಇರ್ತಾರಾ"
                  language: kn
                  doctorName: "Dr Garima"
                  when: { expression: "tomorrow evening" }
              symptomFirst:
                summary: Symptom only, ASR-damaged
                value:
                  utterance: "I need a zoologist appointment for kidney stones scanning"
                  language: en
                  symptomText: "kidney stones scanning"
                  when: { expression: "today" }
              departmentGender:
                summary: Department plus preference
                value:
                  utterance: "lady doctor for thyroid"
                  language: en
                  department: "thyroid doctor"
                  preferences: { gender: FEMALE }
                  when: { expression: "today" }
      responses:
        '200':
          description: Understood meaning, routing decision, sessions with bookable slots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilitySearchResponse' }
              example:
                outcome: FOUND
                asOf: "2026-09-25T17:02:11+05:30"
                routing: { action: OFFER_SLOTS }
                understood:
                  doctors:
                    - { doctorId: doc_garima, name: "Dr. Garima", confidence: 0.94, matchedOn: NAME_PHONETIC }
                  departments: []
                  dates: { from: "2026-09-26", to: "2026-09-26" }
                  dayPart: EVENING
                clarification: null
                results:
                  - doctor:
                      doctorId: doc_garima
                      name: "Dr. Garima"
                      localizedNames: { kn: "ಡಾ. ಗರಿಮಾ", hi: "डॉ. गरिमा" }
                      departments: [ { id: dept_genmed, name: "General Medicine", localizedNames: { kn: "ಸಾಮಾನ್ಯ ವೈದ್ಯಕೀಯ", hi: "सामान्य चिकित्सा" } } ]
                      gender: FEMALE
                      fee: { amount: 600, currency: INR, confirmed: true }
                      dataConfirmed: true
                    sessions:
                      - sessionId: ses_doc_garima_2026-09-26_2
                        date: "2026-09-26"
                        label: Afternoon
                        start: "15:00"
                        end: "17:00"
                        status: SCHEDULED
                        timingCertainty: EXPECTED
                        presence: null
                        capacityModel: SEQUENCE
                        capacity: { total: 12, booked: 3, remaining: 9 }
                        arriveBy: "16:45"
                        bookable: true
                        notBookableReason: null
                        slots:
                          - { slotId: slot_ses_doc_garima_2026-09-26_2_04, kind: SEQUENCE, position: 4, expectedWindow: { from: "15:30", to: "15:50" }, available: true }
                          - { slotId: slot_ses_doc_garima_2026-09-26_2_05, kind: SEQUENCE, position: 5, expectedWindow: { from: "15:40", to: "16:00" }, available: true }
                          - { slotId: slot_ses_doc_garima_2026-09-26_2_06, kind: SEQUENCE, position: 6, expectedWindow: { from: "15:50", to: "16:10" }, available: true }
                    unavailable: []
                alternatives: []
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/appointments:
    post:
      tags: [Agent]
      operationId: agentBookAppointment
      summary: Reserve one slot for one patient
      description: >
        Atomically reserves the slot. RULE: if the slot was taken or the session
        changed since it was offered, return 409 SLOT_UNAVAILABLE with the
        session's current bookable slots so the agent can re-offer without a
        second search. RULE: one call per patient; two patients on one phone are
        two calls with two Idempotency-Keys. RULE: the response contains
        everything the agent needs to close the call (doctor, date, window,
        arriveBy, confirmationCode). Status is BOOKED, which means a slot is
        held; timing remains an expectation unless timingCertainty=CONFIRMED.
      x-mcp:
        expose: true
        tool: manage_appointment
        action: BOOK
        inject_headers: [X-Call-Id, X-Caller-Number, Idempotency-Key]
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallerNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentBookRequest' }
            example:
              slotId: slot_ses_doc_garima_2026-09-26_2_04
              patient: { name: "Lakshmi R", phone: "9876543210", relationToCaller: SELF }
              reasonVerbatim: "ಮೊಣಕಾಲು ನೋವು ಎರಡು ವಾರದಿಂದ"
              language: kn
      responses:
        '201':
          description: Slot reserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentAppointment' }
              example:
                outcome: BOOKED
                appointmentId: appt_0192
                confirmationCode: "4471"
                status: BOOKED
                patient: { name: "Lakshmi R", phone: "9876543210" }
                doctor: { doctorId: doc_garima, name: "Dr. Garima", localizedNames: { kn: "ಡಾ. ಗರಿಮಾ" } }
                department: { id: dept_genmed, name: "General Medicine" }
                date: "2026-09-26"
                session: { sessionId: ses_doc_garima_2026-09-26_2, label: Afternoon, start: "15:00", end: "17:00" }
                slot: { slotId: slot_ses_doc_garima_2026-09-26_2_04, kind: SEQUENCE, position: 4, expectedWindow: { from: "15:30", to: "15:50" } }
                arriveBy: "16:45"
                timingCertainty: EXPECTED
                fee: { amount: 600, currency: INR, confirmed: true }
                doctorToday: null
        '200':
          description: Idempotent replay.
          headers:
            Idempotent-Replay: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentAppointment' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/SlotConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }
    get:
      tags: [Agent]
      operationId: agentListAppointments
      summary: Appointments belonging to the caller's phone number
      description: >
        Scoped by X-Caller-Number (matches the booking phone or the number the
        booking was made from). RULE (tenant disclosure policy, default
        NAME_REQUIRED): if more than one patient is registered under the number
        and patientName is absent, return outcome=NAME_REQUIRED with
        patientsOnNumber and no names. RULE: each item embeds the doctor's
        current session state so "is my doctor coming?" is one call.
      x-mcp:
        expose: true
        tool: manage_appointment
        action: LIST
        inject_headers: [X-Call-Id, X-Caller-Number]
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallerNumber'
        - name: patientName
          in: query
          schema: { type: string, maxLength: 100 }
        - name: phone
          in: query
          description: Only when the caller number is absent (landline) or the caller booked under another number. Read-only; cancel/reschedule on a spoken number is refused by default.
          schema: { $ref: '#/components/schemas/Phone' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Appointments (possibly none).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentAppointmentList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /agent/appointments/{appointmentId}/cancel:
    post:
      tags: [Agent]
      operationId: agentCancelAppointment
      summary: Cancel the caller's appointment
      description: >
        RULE: succeeds only when X-Caller-Number matches the booking phone or the
        booked-from number AND patientName matches. Any mismatch returns the
        same neutral 404 as a non-existent appointment. Releases the slot.
      x-mcp:
        expose: true
        tool: manage_appointment
        action: CANCEL
        inject_headers: [X-Call-Id, X-Caller-Number, Idempotency-Key]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallerNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientName]
              properties:
                patientName: { type: string, maxLength: 100 }
                reasonVerbatim: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentAppointment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /agent/appointments/{appointmentId}/reschedule:
    post:
      tags: [Agent]
      operationId: agentRescheduleAppointment
      summary: Move the caller's appointment to another slot
      description: >
        Same verification as cancel. newSlotId comes from find_availability and
        may belong to a different doctor. Atomic: old slot released and new
        slot reserved together, or nothing changes (409 SLOT_UNAVAILABLE).
      x-mcp:
        expose: true
        tool: manage_appointment
        action: RESCHEDULE
        inject_headers: [X-Call-Id, X-Caller-Number, Idempotency-Key]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallerNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientName, newSlotId]
              properties:
                patientName: { type: string, maxLength: 100 }
                newSlotId: { type: string }
      responses:
        '200':
          description: Rescheduled. Response includes previous slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentAppointment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SlotConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  # ===========================================================================
  # DIRECTORY — who exists, in every language the callers use
  # ===========================================================================

  /departments:
    get:
      tags: [Directory]
      operationId: listDepartments
      summary: Departments with localized names
      description: Tenant-static; cacheable (ETag). hasConsultant=false means never offer or route.
      responses:
        '200':
          description: Departments.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Department' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /doctors:
    get:
      tags: [Directory]
      operationId: listDoctors
      summary: Doctor directory (staff and web; the agent uses availability-search)
      parameters:
        - name: department
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Doctors.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Doctor' }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Directory]
      operationId: createDoctor
      summary: Add a doctor (admin)
      security:
        - oauth2: [directory.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoctorInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /doctors/{doctorId}:
    get:
      tags: [Directory]
      operationId: getDoctor
      summary: One doctor with schedule template summary
      parameters:
        - $ref: '#/components/parameters/DoctorId'
      responses:
        '200':
          description: Doctor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Directory]
      operationId: updateDoctor
      summary: Update a doctor (admin). Sets dataConfirmed when the hospital signs off.
      security:
        - oauth2: [directory.write]
      parameters:
        - $ref: '#/components/parameters/DoctorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoctorInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lexicon:
    get:
      tags: [Directory]
      operationId: listLexicon
      summary: Multilingual terms the resolver uses
      description: >
        WHY: callers say "skin doctor", "ಚರ್ಮ ವೈದ್ಯ", "charm ka doctor", "thyroid
        doctor". The hospital decides what each maps to (e.g. thyroid → General
        Medicine, not endocrinology). Entries are approved before use.
        RED_FLAG entries drive the emergency check. Unapproved entries are
        ignored by the resolver.
      security:
        - oauth2: [directory.write]
      parameters:
        - name: conceptType
          in: query
          schema: { $ref: '#/components/schemas/LexiconConceptType' }
        - name: language
          in: query
          schema: { $ref: '#/components/schemas/Language' }
        - name: approved
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Lexicon entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LexiconEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Directory]
      operationId: addLexiconEntry
      summary: Add or approve a term
      security:
        - oauth2: [directory.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LexiconEntryInput' }
            example:
              conceptType: DEPARTMENT
              conceptId: dept_genmed
              term: "thyroid doctor"
              language: en
              approved: true
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LexiconEntry' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ===========================================================================
  # SCHEDULING — the plan, the reality, and right now
  # ===========================================================================

  /doctors/{doctorId}/schedule-template:
    get:
      tags: [Scheduling]
      operationId: getScheduleTemplate
      summary: The doctor's recurring sessions
      parameters:
        - $ref: '#/components/parameters/DoctorId'
      responses:
        '200':
          description: Template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleTemplate' }
              example:
                doctorId: doc_garima
                effectiveFrom: "2026-09-01"
                effectiveTo: null
                sessions:
                  - templateSessionId: tpl_doc_garima_am
                    label: Morning
                    daysOfWeek: [MON, THU, FRI]
                    start: "09:00"
                    end: "12:00"
                    capacityModel: SEQUENCE
                    capacity: { mode: PER_HOUR, value: 4 }
                    walkInReservePercent: 25
                    lastArrivalOffsetMinutes: 15
                  - templateSessionId: tpl_doc_garima_pm
                    label: Afternoon
                    daysOfWeek: [MON, THU, FRI]
                    start: "15:00"
                    end: "17:00"
                    capacityModel: SEQUENCE
                    capacity: { mode: FIXED, value: 12 }
                    walkInReservePercent: 25
                    lastArrivalOffsetMinutes: 15
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Scheduling]
      operationId: setScheduleTemplate
      summary: Replace the doctor's recurring sessions (admin/desk)
      description: >
        RULE: a new template takes effect from effectiveFrom; existing
        appointments before that date are untouched. Appointments on or after
        effectiveFrom that no longer fit a session become impacted (see
        /schedule-exceptions/{id}/impact semantics) and generate notifications.
      security:
        - oauth2: [schedule.write]
      parameters:
        - $ref: '#/components/parameters/DoctorId'
        - $ref: '#/components/parameters/ActingUser'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleTemplate' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleTemplate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schedule-exceptions:
    get:
      tags: [Scheduling]
      operationId: listScheduleExceptions
      summary: Known deviations from templates (leave, surgery, extra sessions)
      parameters:
        - name: doctorId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Exceptions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleException' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Scheduling]
      operationId: createScheduleException
      summary: Record reality — today or any future date
      description: >
        WHY: "Dr. Garima has two surgeries this Thursday" is known on Monday.
        Record it now; availability for Thursday changes immediately and the
        impacted patients are computed. RULE: creating an exception that removes
        or shortens a session moves the affected appointments to status
        NEEDS_RESCHEDULE and creates a Notification per appointment. The reason
        category is internal; the agent never receives it.
      security:
        - oauth2: [schedule.write]
      parameters:
        - $ref: '#/components/parameters/ActingUser'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleExceptionInput' }
            examples:
              surgeryDay:
                summary: Whole afternoon unavailable on a future date
                value:
                  doctorId: doc_garima
                  dateFrom: "2026-10-01"
                  dateTo: "2026-10-01"
                  scope: SESSION
                  templateSessionId: tpl_doc_garima_pm
                  effect: UNAVAILABLE
                  reasonCategory: SURGERY
              startsLate:
                summary: Same-day time change
                value:
                  doctorId: doc_garima
                  dateFrom: "2026-09-25"
                  dateTo: "2026-09-25"
                  scope: SESSION
                  templateSessionId: tpl_doc_garima_am
                  effect: TIME_CHANGE
                  newStart: "10:00"
                  newEnd: "12:00"
                  reasonCategory: OTHER
              extraSunday:
                summary: Extra session on a non-template day
                value:
                  doctorId: doc_garima
                  dateFrom: "2026-09-27"
                  dateTo: "2026-09-27"
                  scope: TIME_RANGE
                  effect: EXTRA_SESSION
                  newStart: "10:00"
                  newEnd: "12:00"
                  newCapacity: 8
                  reasonCategory: OTHER
      responses:
        '201':
          description: Recorded, with impact summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleException' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /schedule-exceptions/{exceptionId}:
    delete:
      tags: [Scheduling]
      operationId: deleteScheduleException
      summary: Withdraw an exception (the doctor is coming after all)
      description: "RULE: appointments moved to NEEDS_RESCHEDULE by this exception return to BOOKED if their slot still fits; otherwise they stay and are re-notified."
      security:
        - oauth2: [schedule.write]
      parameters:
        - name: exceptionId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/ActingUser'
      responses:
        '204': { description: Withdrawn. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schedule-exceptions/{exceptionId}/impact:
    get:
      tags: [Scheduling]
      operationId: getScheduleExceptionImpact
      summary: Appointments impacted by an exception, with notification state
      description: "WHY: this is the outbound-call list. Staff today; SMS/voice bot later."
      security:
        - oauth2: [appointments.staff]
      parameters:
        - name: exceptionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Impacted appointments.
          content:
            application/json:
              schema:
                type: object
                required: [exceptionId, items]
                properties:
                  exceptionId: { type: string }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ImpactedAppointment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /board/{doctorId}:
    get:
      tags: [Scheduling]
      operationId: getBoard
      summary: Live board for one doctor on a date (right now facts)
      parameters:
        - $ref: '#/components/parameters/DoctorId'
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Board entries per session.
          content:
            application/json:
              schema:
                type: object
                required: [doctorId, date, sessions]
                properties:
                  doctorId: { type: string }
                  date: { type: string, format: date }
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/BoardEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Scheduling]
      operationId: setBoard
      summary: Desk marks arrived / late / left / full for a session (today)
      description: >
        WHY: the board is same-day operational truth: the doctor arrived, is 30
        minutes late, has left, the list is full. It never changes the template.
        RULE: presence=LEFT or sessionEnded=true makes the session unbookable for
        the rest of the day. RULE: capacityState=FULL closes remaining slots.
        Board facts expire at end of day.
      security:
        - oauth2: [board.write]
      parameters:
        - $ref: '#/components/parameters/DoctorId'
        - $ref: '#/components/parameters/ActingUser'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoardEntryInput' }
            example:
              date: "2026-09-25"
              sessionId: ses_doc_garima_2026-09-25_1
              presence: ARRIVING
              expectedStart: "09:20"
              delayMinutes: 20
      responses:
        '200':
          description: Updated entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardEntry' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # AVAILABILITY — computed, read-only, same engine the agent uses
  # ===========================================================================

  /availability:
    get:
      tags: [Availability]
      operationId: getAvailability
      summary: Materialised sessions with slots for a doctor or department over a date range
      description: >
        RULE (the availability algorithm, used by this endpoint and by
        agentAvailabilitySearch):
          1. For each date in [from,to], take template sessions whose daysOfWeek
             match and whose template is effective.
          2. Apply exceptions: UNAVAILABLE removes; TIME_CHANGE moves start/end;
             CAPACITY_CHANGE alters capacity; EXTRA_SESSION adds.
          3. If date is today, overlay the board: presence, expectedStart, delay,
             sessionEnded, capacityState.
          4. Capacity total = FIXED value, or PER_HOUR value × duration hours, or
             tenant default (capacitySource=DEFAULT). Bookable = total −
             walkInReserve. Slots = bookable positions (SEQUENCE) or fixed-length
             times (TIMED); mark each slot available/booked from appointments.
          5. arriveBy = min(lastArrivalTime from board, end − lastArrivalOffset).
             bookable=false with a reason when: ended, left, full, cancelled,
             arriveBy passed, or no session.
          6. timingCertainty: CONFIRMED if the desk confirmed this session
             (board or exception marked confirmed), EXPECTED if from template
             only, NOT_CONFIRMED if the desk flagged it pending. dataConfirmed
             =false on the doctor caps certainty at EXPECTED.
        Never cached across requests; always computed.
      parameters:
        - name: doctorId
          in: query
          schema: { type: string }
        - name: department
          in: query
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: includeSlots
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Session instances.
          content:
            application/json:
              schema:
                type: object
                required: [asOf, items]
                properties:
                  asOf: { type: string, format: date-time }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SessionInstance' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ===========================================================================
  # APPOINTMENTS — staff side
  # ===========================================================================

  /appointments:
    get:
      tags: [Appointments]
      operationId: searchAppointments
      summary: Staff search (any filter)
      security:
        - oauth2: [appointments.staff]
      parameters:
        - name: doctorId
          in: query
          schema: { type: string }
        - name: sessionId
          in: query
          schema: { type: string }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: phone
          in: query
          schema: { $ref: '#/components/schemas/Phone' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AppointmentStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Appointments.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Appointment' }
                  total: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Appointments]
      operationId: deskCreateAppointment
      summary: Desk books on behalf of a walk-in or phone caller
      description: Same slot rules as the agent path; createdVia=DESK; no caller-number check.
      security:
        - oauth2: [appointments.staff]
      parameters:
        - $ref: '#/components/parameters/ActingUser'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentBookRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SlotConflict' }

  /appointments/{appointmentId}:
    get:
      tags: [Appointments]
      operationId: getAppointment
      summary: One appointment, full detail (staff)
      security:
        - oauth2: [appointments.staff]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Appointment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /appointments/{appointmentId}/confirm:
    post:
      tags: [Appointments]
      operationId: confirmAppointment
      summary: Desk confirms the timing with the doctor
      description: Sets timingCertainty=CONFIRMED on the appointment (and optionally the session). The only state the agent may voice as "confirmed".
      security:
        - oauth2: [appointments.staff]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/ActingUser'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmedStart: { $ref: '#/components/schemas/ClockTime' }
                applyToSession: { type: boolean, default: false }
      responses:
        '200':
          description: Confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /appointments/{appointmentId}/status:
    post:
      tags: [Appointments]
      operationId: setAppointmentStatus
      summary: Desk marks arrived / completed / no-show, or cancels on the hospital's behalf
      security:
        - oauth2: [appointments.staff]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/ActingUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ARRIVED, COMPLETED, NO_SHOW, CANCELLED_BY_HOSPITAL]
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ===========================================================================
  # NOTIFICATIONS — impacted patients (outbound later)
  # ===========================================================================

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Pending and sent notifications to impacted patients
      security:
        - oauth2: [appointments.staff]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, SENT, FAILED, ACKNOWLEDGED], default: PENDING }
        - name: doctorId
          in: query
          schema: { type: string }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Notifications.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notifications/{notificationId}/delivered:
    post:
      tags: [Notifications]
      operationId: markNotificationDelivered
      summary: Record that the patient was informed (by desk today, by SMS/voice bot later)
      security:
        - oauth2: [appointments.staff]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/ActingUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [PHONE, SMS, WHATSAPP, IN_PERSON, VOICE_BOT] }
                outcome: { type: string, enum: [INFORMED, RESCHEDULED, CANCELLED, NO_ANSWER] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # CALLS
  # ===========================================================================

  /call-summaries:
    post:
      tags: [Calls]
      operationId: storeCallSummary
      summary: Voice platform posts a summary when a call ends
      security:
        - oauth2: [calls.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallSummary' }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallSummary' }
        '200':
          description: Same callId already stored; returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [Calls]
      operationId: listCallSummaries
      summary: Admin UI listing
      security:
        - oauth2: [calls.read]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Summaries.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CallSummary' }
                  total: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  securitySchemes:
    oauth2:
      type: oauth2
      description: Client credentials per consumer; tenant bound to the credential.
      flows:
        clientCredentials:
          tokenUrl: https://auth.example-product.com/oauth2/token
          scopes:
            agent: Voice agent facade (all /agent operations)
            directory.write: Manage doctors, departments, lexicon
            schedule.write: Manage templates and exceptions
            board.write: Update the live board
            appointments.staff: Staff appointment operations, impact lists, notifications
            calls.write: Store call summaries
            calls.read: Read call summaries

  parameters:
    CallId:
      name: X-Call-Id
      in: header
      required: true
      description: Voice platform call id. Injected by the MCP layer; never a model argument.
      schema: { type: string, maxLength: 64 }
    CallerNumber:
      name: X-Caller-Number
      in: header
      required: false
      description: >
        Network caller number in E.164 from SIP, injected by the MCP layer.
        Absent for withheld or landline callers. Never a model argument.
      schema: { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required on the agent path. Replay returns 200 + Idempotent-Replay. Retained 24 h.
      schema: { type: string, maxLength: 64 }
    ActingUser:
      name: X-Acting-User
      in: header
      required: true
      description: Staff identity for audit.
      schema: { type: string, maxLength: 64 }
    DoctorId:
      name: doctorId
      in: path
      required: true
      schema: { type: string }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    ValidationFailed:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Missing scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found, or on verified operations the caller number or patient name did not match. Indistinguishable on purpose.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State does not allow the operation, or idempotency conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SlotConflict:
      description: >
        SLOT_UNAVAILABLE: the slot was taken or the session changed since it
        was offered. details.currentSlots carries the session's current
        bookable slots so the agent can re-offer without another search.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: SLOT_UNAVAILABLE
              message: "Slot already booked"
              currentSlots:
                - { slotId: slot_ses_doc_garima_2026-09-26_2_05, kind: SEQUENCE, position: 5, expectedWindow: { from: "15:40", to: "16:00" }, available: true }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: Unexpected error. Nothing may be inferred about the data.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Temporarily unavailable.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamTimeout:
      description: Write did not complete within 5 s. Retry once with the same Idempotency-Key; never with a new one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ---------- primitives ----------

    Language:
      type: string
      description: BCP-47 primary tag as reported by STT (en, kn, hi, ta, te, ...). Not restricted to three.
      example: kn

    LocalizedText:
      type: object
      description: Approved display text per language. Keys are Language values. The agent speaks the entry matching the caller's language when present, else the canonical name.
      additionalProperties: { type: string }
      example: { kn: "ಚರ್ಮರೋಗ ವಿಭಾಗ", hi: "त्वचा विभाग" }

    Phone:
      type: string
      description: Contact number as dictated, digits only, national format for the tenant (10 digits for the first tenant). Distinct from X-Caller-Number.
      pattern: '^[0-9]{6,15}$'
      example: "9876543210"

    ClockTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: "15:30"

    Money:
      type: object
      required: [amount, currency, confirmed]
      properties:
        amount: { type: number }
        currency: { type: string, example: INR }
        confirmed:
          type: boolean
          description: False until the hospital approves the value. RULE for the agent — never speak an unconfirmed fee.

    Gender:
      type: string
      enum: [FEMALE, MALE]

    DayOfWeek:
      type: string
      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]

    DayPart:
      type: string
      enum: [MORNING, AFTERNOON, EVENING, ANY]
      description: Tenant maps these to clock ranges (e.g. MORNING 06:00-12:00, AFTERNOON 12:00-17:00, EVENING 17:00-23:00).

    # ---------- directory ----------

    Department:
      type: object
      required: [id, name, hasConsultant, active]
      properties:
        id: { type: string, example: dept_derm }
        code: { type: string, example: DERM }
        name: { type: string, example: Dermatology }
        localizedNames: { $ref: '#/components/schemas/LocalizedText' }
        hasConsultant: { type: boolean, description: False means never offer or route. }
        active: { type: boolean }

    Doctor:
      type: object
      required: [id, name, departments, active, dataConfirmed]
      properties:
        id: { type: string, example: doc_garima }
        name: { type: string, example: "Dr. Garima" }
        localizedNames: { $ref: '#/components/schemas/LocalizedText' }
        nameVariants:
          type: array
          items: { type: string }
          description: Spellings and transliterations heard from callers; fed to the phonetic index. Maintained by the hospital and auto-augmented by transliteration.
        gender:
          allOf: [{ $ref: '#/components/schemas/Gender' }]
          nullable: true
        departments:
          type: array
          items: { $ref: '#/components/schemas/Department' }
        qualification: { type: string, example: "MBBS, MD - General Medicine" }
        yearsOfExperience: { type: integer, nullable: true }
        languagesSpoken:
          type: array
          items: { $ref: '#/components/schemas/Language' }
        fee:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        attendanceType:
          type: string
          enum: [REGULAR, VISITING, ON_CALL]
          description: ON_CALL doctors have no template; availability comes only from exceptions of effect EXTRA_SESSION or the board.
        bookingPolicy:
          type: string
          enum: [BOOKABLE, DESK_ONLY, NO_OPD]
          description: DESK_ONLY means the agent may show sessions but must transfer to book. NO_OPD means never offer.
        dataConfirmed:
          type: boolean
          description: False while the hospital has not signed off this row. Caps timingCertainty at EXPECTED.
        active: { type: boolean }

    DoctorInput:
      type: object
      required: [name, departmentIds]
      properties:
        name: { type: string }
        localizedNames: { $ref: '#/components/schemas/LocalizedText' }
        nameVariants:
          type: array
          items: { type: string }
        gender:
          allOf: [{ $ref: '#/components/schemas/Gender' }]
          nullable: true
        departmentIds:
          type: array
          items: { type: string }
        qualification: { type: string }
        yearsOfExperience: { type: integer, nullable: true }
        languagesSpoken:
          type: array
          items: { $ref: '#/components/schemas/Language' }
        fee:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        attendanceType: { type: string, enum: [REGULAR, VISITING, ON_CALL] }
        bookingPolicy: { type: string, enum: [BOOKABLE, DESK_ONLY, NO_OPD] }
        dataConfirmed: { type: boolean }
        active: { type: boolean }

    LexiconConceptType:
      type: string
      enum: [DEPARTMENT, DOCTOR, SYMPTOM_ROUTE, RED_FLAG, DAY_PART, SERVICE_TRANSFER]
      description: >
        DEPARTMENT: a way callers name a department. DOCTOR: a way callers say a
        doctor's name. SYMPTOM_ROUTE: hospital-approved symptom phrase → department
        (thyroid → General Medicine). RED_FLAG: emergency phrase → TRANSFER_EMERGENCY.
        DAY_PART: "evening", "ಸಂಜೆ", "shaam" → EVENING. SERVICE_TRANSFER: lab,
        pharmacy, insurance → TRANSFER_DESK with a destination.

    LexiconEntry:
      type: object
      required: [id, conceptType, conceptId, term, language, approved]
      properties:
        id: { type: string }
        conceptType: { $ref: '#/components/schemas/LexiconConceptType' }
        conceptId:
          type: string
          description: Department id, doctor id, DayPart value, or transfer destination code.
        term: { type: string, description: 'The phrase as callers say it, any script.' }
        termNormalized: { type: string, description: 'Server-computed: NFC, lower-case, transliterated to Latin.' }
        language: { $ref: '#/components/schemas/Language' }
        approved: { type: boolean }
        source: { type: string, enum: [HOSPITAL, TRANSCRIPT_MINED, AUTO_TRANSLITERATION] }

    LexiconEntryInput:
      type: object
      required: [conceptType, conceptId, term, language]
      properties:
        conceptType: { $ref: '#/components/schemas/LexiconConceptType' }
        conceptId: { type: string }
        term: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        approved: { type: boolean, default: false }

    # ---------- scheduling: plan ----------

    CapacitySpec:
      type: object
      required: [mode]
      description: >
        How many patients a session can take. FIXED: value is the total.
        PER_HOUR: total = value × session hours. DEFAULT: tenant default applies
        (flagged in results as capacitySource=DEFAULT so the hospital knows it
        is a guess to be corrected).
      properties:
        mode: { type: string, enum: [FIXED, PER_HOUR, DEFAULT] }
        value: { type: integer, minimum: 1, nullable: true }

    TemplateSession:
      type: object
      required: [templateSessionId, daysOfWeek, start, end, capacityModel, capacity]
      properties:
        templateSessionId: { type: string, example: tpl_doc_garima_am }
        label: { type: string, example: Morning }
        daysOfWeek:
          type: array
          items: { $ref: '#/components/schemas/DayOfWeek' }
        start: { $ref: '#/components/schemas/ClockTime' }
        end: { $ref: '#/components/schemas/ClockTime' }
        capacityModel:
          type: string
          enum: [SEQUENCE, TIMED]
          description: >
            SEQUENCE: patients seen in arrival/booking order; a slot is a
            position with an expected window (token OPD). TIMED: a slot is a
            fixed-length reserved time (specialist clinics, scans).
        slotMinutes:
          type: integer
          nullable: true
          description: TIMED only. Length of each slot.
        capacity: { $ref: '#/components/schemas/CapacitySpec' }
        walkInReservePercent:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Share of capacity never offered to phone bookings, kept for walk-ins.
        lastArrivalOffsetMinutes:
          type: integer
          minimum: 0
          default: 15
          description: arriveBy = end − this, unless the desk sets an earlier lastArrivalTime.

    ScheduleTemplate:
      type: object
      required: [doctorId, effectiveFrom, sessions]
      properties:
        doctorId: { type: string }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/TemplateSession' }

    # ---------- scheduling: reality ----------

    ScheduleExceptionInput:
      type: object
      required: [doctorId, dateFrom, dateTo, scope, effect]
      properties:
        doctorId: { type: string }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        scope:
          type: string
          enum: [WHOLE_DAY, SESSION, TIME_RANGE]
          description: WHOLE_DAY affects every session that day. SESSION targets templateSessionId. TIME_RANGE targets newStart–newEnd (used with EXTRA_SESSION or a partial block).
        templateSessionId: { type: string, nullable: true }
        effect:
          type: string
          enum: [UNAVAILABLE, TIME_CHANGE, CAPACITY_CHANGE, EXTRA_SESSION, TIMING_PENDING, TIMING_CONFIRMED]
          description: >
            UNAVAILABLE removes the session(s). TIME_CHANGE moves them to
            newStart–newEnd. CAPACITY_CHANGE sets newCapacity. EXTRA_SESSION
            adds a session on a day the template does not have one.
            TIMING_PENDING marks the session as not yet confirmed by the doctor
            (agent hears NOT_CONFIRMED). TIMING_CONFIRMED marks it confirmed.
        newStart: { $ref: '#/components/schemas/ClockTime' }
        newEnd: { $ref: '#/components/schemas/ClockTime' }
        newCapacity: { type: integer, minimum: 0, nullable: true }
        reasonCategory:
          type: string
          enum: [LEAVE, SURGERY, CONFERENCE, PERSONAL, EMERGENCY_DUTY, OTHER]
          description: Internal. Never returned on the agent path.
        note: { type: string, maxLength: 500, description: Internal. }

    ScheduleException:
      allOf:
        - $ref: '#/components/schemas/ScheduleExceptionInput'
        - type: object
          required: [id, createdAt, createdBy, impact]
          properties:
            id: { type: string, example: exc_0042 }
            createdAt: { type: string, format: date-time }
            createdBy: { type: string }
            impact:
              type: object
              required: [appointmentsImpacted, notificationsCreated]
              properties:
                appointmentsImpacted: { type: integer }
                notificationsCreated: { type: integer }

    # ---------- scheduling: right now ----------

    Presence:
      type: string
      enum: [NOT_ARRIVED, ARRIVING, PRESENT, LEFT]

    BoardEntryInput:
      type: object
      required: [date, sessionId]
      properties:
        date: { type: string, format: date }
        sessionId: { type: string }
        presence: { $ref: '#/components/schemas/Presence' }
        expectedStart: { $ref: '#/components/schemas/ClockTime' }
        delayMinutes: { type: integer, minimum: 0 }
        sessionEnded: { type: boolean }
        capacityState: { type: string, enum: [OPEN, FULL] }
        tokensIssued:
          type: integer
          minimum: 0
          description: Walk-in tokens issued so far, if the desk records it. Informational.
        lastArrivalTime: { $ref: '#/components/schemas/ClockTime' }
        timingConfirmed: { type: boolean, description: Desk has confirmed today's timing with the doctor. }

    BoardEntry:
      allOf:
        - $ref: '#/components/schemas/BoardEntryInput'
        - type: object
          required: [updatedAt, updatedBy]
          properties:
            updatedAt: { type: string, format: date-time }
            updatedBy: { type: string, description: Staff scope only. }

    # ---------- availability: computed ----------

    TimingCertainty:
      type: string
      enum: [CONFIRMED, EXPECTED, NOT_CONFIRMED]
      description: CONFIRMED — desk confirmed with the doctor. EXPECTED — from the template. NOT_CONFIRMED — desk flagged pending.

    NotBookableReason:
      type: string
      enum: [SESSION_ENDED, LEFT_FOR_DAY, ARRIVE_BY_PASSED, FULL, CANCELLED, NO_SESSION_THAT_DAY, ON_CALL_ONLY, DESK_ONLY, NO_OPD]

    Slot:
      type: object
      required: [slotId, kind, available]
      properties:
        slotId: { type: string, example: slot_ses_doc_garima_2026-09-26_2_04 }
        kind: { type: string, enum: [SEQUENCE, TIMED] }
        position: { type: integer, minimum: 1, nullable: true, description: SEQUENCE only. }
        start:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
          description: TIMED only.
        end:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
          description: TIMED only.
        expectedWindow:
          type: object
          nullable: true
          description: SEQUENCE only. Server-computed from start and throughput; spoken as "around".
          properties:
            from: { $ref: '#/components/schemas/ClockTime' }
            to: { $ref: '#/components/schemas/ClockTime' }
        available: { type: boolean }

    SessionInstance:
      type: object
      required: [sessionId, doctorId, date, start, end, status, timingCertainty, capacityModel, capacity, bookable]
      properties:
        sessionId: { type: string, example: ses_doc_garima_2026-09-26_2 }
        doctorId: { type: string }
        templateSessionId: { type: string, nullable: true }
        date: { type: string, format: date }
        label: { type: string }
        start: { $ref: '#/components/schemas/ClockTime' }
        end: { $ref: '#/components/schemas/ClockTime' }
        status:
          type: string
          enum: [SCHEDULED, CHANGED, CANCELLED, ENDED]
          description: CHANGED means an exception moved it from the template.
        timingCertainty: { $ref: '#/components/schemas/TimingCertainty' }
        presence:
          allOf: [{ $ref: '#/components/schemas/Presence' }]
          nullable: true
          description: Today only.
        expectedStart:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
        delayMinutes: { type: integer, nullable: true }
        capacityModel: { type: string, enum: [SEQUENCE, TIMED] }
        capacity:
          type: object
          required: [total, booked, remaining]
          properties:
            total: { type: integer }
            booked: { type: integer }
            remaining: { type: integer, description: Bookable by phone = total − walk-in reserve − booked. }
            walkInReserve: { type: integer }
            capacitySource: { type: string, enum: [FIXED, PER_HOUR, DEFAULT] }
        arriveBy:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
        bookable: { type: boolean }
        notBookableReason:
          allOf: [{ $ref: '#/components/schemas/NotBookableReason' }]
          nullable: true
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }

    # ---------- agent facade ----------

    AvailabilitySearchRequest:
      type: object
      required: [utterance, language]
      description: >
        Everything optional except the caller's words. The LLM fills what it
        heard; the server does the understanding. Fields may be in any language
        or script. Nothing here is an id — the LLM never invents ids.
      properties:
        utterance:
          type: string
          maxLength: 500
          description: The caller's request verbatim (as STT delivered it).
        language: { $ref: '#/components/schemas/Language' }
        doctorName: { type: string, maxLength: 100, description: If the caller named a doctor. As heard. }
        department: { type: string, maxLength: 100, description: If the caller named a speciality or department. As heard. }
        symptomText: { type: string, maxLength: 300, description: If the caller described a problem. As heard. Server maps via approved SYMPTOM_ROUTE only. }
        when:
          type: object
          description: Either an expression ("tomorrow evening", "ನಾಳೆ", "kal shaam") or explicit dates. Server resolves in facility time.
          properties:
            expression: { type: string, maxLength: 100 }
            dateFrom: { type: string, format: date }
            dateTo: { type: string, format: date }
            dayPart: { $ref: '#/components/schemas/DayPart' }
        preferences:
          type: object
          properties:
            gender: { $ref: '#/components/schemas/Gender' }
            language: { $ref: '#/components/schemas/Language' }
        maxDoctors: { type: integer, minimum: 1, maximum: 5, default: 3 }
        maxSlotsPerSession: { type: integer, minimum: 1, maximum: 5, default: 3 }

    Understood:
      type: object
      description: What the server made of the words. Returned so the agent can confirm ("Dr. Garima, tomorrow evening?").
      required: [doctors, departments]
      properties:
        doctors:
          type: array
          items:
            type: object
            required: [doctorId, name, confidence, matchedOn]
            properties:
              doctorId: { type: string }
              name: { type: string }
              localizedNames: { $ref: '#/components/schemas/LocalizedText' }
              confidence: { type: number, minimum: 0, maximum: 1 }
              matchedOn: { type: string, enum: [NAME_EXACT, NAME_PHONETIC, NAME_VARIANT, LEXICON] }
        departments:
          type: array
          items:
            type: object
            required: [id, name, confidence, matchedOn]
            properties:
              id: { type: string }
              name: { type: string }
              localizedNames: { $ref: '#/components/schemas/LocalizedText' }
              confidence: { type: number, minimum: 0, maximum: 1 }
              matchedOn: { type: string, enum: [LEXICON, SYMPTOM_ROUTE, SEMANTIC] }
        dates:
          type: object
          nullable: true
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        dayPart:
          allOf: [{ $ref: '#/components/schemas/DayPart' }]
          nullable: true

    Routing:
      type: object
      required: [action]
      description: >
        The next thing the agent should do. OFFER_SLOTS — read results.
        CLARIFY — ask the question in clarification. TRANSFER_EMERGENCY — a
        RED_FLAG matched; stop and transfer. TRANSFER_DESK — request is not a
        consultation (lab, pharmacy, insurance) or the doctor is DESK_ONLY;
        destination given. NO_SERVICE — the department does not exist or has
        no consultant; suggestions may be present.
      properties:
        action: { type: string, enum: [OFFER_SLOTS, CLARIFY, TRANSFER_EMERGENCY, TRANSFER_DESK, NO_SERVICE] }
        destination: { type: string, nullable: true, description: Transfer destination code from tenant telephony config. }

    Clarification:
      type: object
      nullable: true
      required: [type, options]
      properties:
        type:
          type: string
          enum: [WHICH_DOCTOR, WHICH_DEPARTMENT, WHICH_DATE, WHICH_PATIENT, CONFIRM_INTERPRETATION]
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
              localizedLabels: { $ref: '#/components/schemas/LocalizedText' }
              detail: { type: string, nullable: true, description: e.g. department for a doctor option. }

    DoctorResult:
      type: object
      required: [doctor, sessions, unavailable]
      properties:
        doctor:
          type: object
          required: [doctorId, name, departments, dataConfirmed]
          properties:
            doctorId: { type: string }
            name: { type: string }
            localizedNames: { $ref: '#/components/schemas/LocalizedText' }
            departments:
              type: array
              items: { $ref: '#/components/schemas/Department' }
            gender:
              allOf: [{ $ref: '#/components/schemas/Gender' }]
              nullable: true
            qualification: { type: string, nullable: true }
            fee:
              allOf: [{ $ref: '#/components/schemas/Money' }]
              nullable: true
            dataConfirmed: { type: boolean }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionInstance' }
        unavailable:
          type: array
          description: Sessions in range that cannot be booked, with the reason and the next bookable session.
          items:
            type: object
            required: [date, reason]
            properties:
              date: { type: string, format: date }
              sessionId: { type: string, nullable: true }
              reason: { $ref: '#/components/schemas/NotBookableReason' }
              nextBookable:
                type: object
                nullable: true
                properties:
                  date: { type: string, format: date }
                  start: { $ref: '#/components/schemas/ClockTime' }
                  end: { $ref: '#/components/schemas/ClockTime' }

    AvailabilitySearchResponse:
      type: object
      required: [outcome, asOf, routing, understood, results, alternatives]
      properties:
        outcome:
          type: string
          enum: [FOUND, NONE_AVAILABLE, CLARIFICATION_NEEDED, TRANSFER, COULD_NOT_CHECK]
          description: The one field the agent branches on.
        asOf: { type: string, format: date-time }
        routing: { $ref: '#/components/schemas/Routing' }
        understood: { $ref: '#/components/schemas/Understood' }
        clarification: { $ref: '#/components/schemas/Clarification' }
        results:
          type: array
          items: { $ref: '#/components/schemas/DoctorResult' }
        alternatives:
          type: array
          description: Same-department doctors with bookable sessions when the requested doctor has none.
          items: { $ref: '#/components/schemas/DoctorResult' }
        partial:
          type: boolean
          description: True when part of the data could not be fetched; see notes.
        notes:
          type: array
          items: { type: string }

    AgentBookRequest:
      type: object
      required: [slotId, patient, language]
      properties:
        slotId: { type: string }
        patient:
          type: object
          required: [name, phone]
          properties:
            name: { type: string, maxLength: 100, description: As spoken and spelled back. }
            phone:
              allOf: [{ $ref: '#/components/schemas/Phone' }]
              description: Dictated and read back. Never defaulted from the caller number.
            relationToCaller:
              type: string
              enum: [SELF, CHILD, PARENT, SPOUSE, OTHER]
              nullable: true
        reasonVerbatim: { type: string, maxLength: 500, description: "Caller's words, any language. Never an interpretation." }
        language: { $ref: '#/components/schemas/Language' }
        requestTimingConfirmation:
          type: boolean
          default: false
          description: Caller wants the desk to confirm timing when the session is NOT_CONFIRMED. Honoured only if the tenant works that list.

    AgentAppointment:
      type: object
      required: [outcome, appointmentId, status, patient, doctor, date, session, slot, timingCertainty]
      properties:
        outcome:
          type: string
          enum: [BOOKED, ALREADY_BOOKED, CANCELLED, RESCHEDULED, FOUND]
        appointmentId: { type: string }
        confirmationCode:
          type: string
          description: Short code the agent reads back; lets a caller identify a booking on a later call without exposing ids.
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        patient:
          type: object
          properties:
            name: { type: string }
            phone: { $ref: '#/components/schemas/Phone' }
        doctor:
          type: object
          properties:
            doctorId: { type: string }
            name: { type: string }
            localizedNames: { $ref: '#/components/schemas/LocalizedText' }
        department: { $ref: '#/components/schemas/Department' }
        date: { type: string, format: date }
        session:
          type: object
          properties:
            sessionId: { type: string }
            label: { type: string }
            start: { $ref: '#/components/schemas/ClockTime' }
            end: { $ref: '#/components/schemas/ClockTime' }
        slot: { $ref: '#/components/schemas/Slot' }
        previousSlot:
          allOf: [{ $ref: '#/components/schemas/Slot' }]
          nullable: true
        arriveBy:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
        timingCertainty: { $ref: '#/components/schemas/TimingCertainty' }
        fee:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        followUp:
          type: string
          enum: [NONE, DESK_WILL_CONFIRM_TIMING]
          description: The agent may promise a desk call only when this is DESK_WILL_CONFIRM_TIMING.
        doctorToday:
          allOf: [{ $ref: '#/components/schemas/SessionInstance' }]
          nullable: true
          description: Present on LIST for same-day appointments — answers "is my doctor coming?".

    AgentAppointmentList:
      type: object
      required: [outcome, items, patientsOnNumber, identityBasis]
      properties:
        outcome: { type: string, enum: [FOUND, NONE_FOUND, NAME_REQUIRED, IDENTITY_UNAVAILABLE] }
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentAppointment' }
        patientsOnNumber: { type: integer }
        identityBasis: { type: string, enum: [CALLER_NUMBER, SPOKEN_NUMBER, NONE] }

    # ---------- appointments: full record ----------

    AppointmentStatus:
      type: string
      enum: [BOOKED, CONFIRMED_BY_DESK, RESCHEDULED, NEEDS_RESCHEDULE, ARRIVED, COMPLETED, NO_SHOW, CANCELLED_BY_PATIENT, CANCELLED_BY_HOSPITAL]
      description: >
        BOOKED — slot held. CONFIRMED_BY_DESK — desk confirmed timing.
        RESCHEDULED — moved by patient. NEEDS_RESCHEDULE — session removed by an
        exception; patient to be notified. ARRIVED/COMPLETED/NO_SHOW — desk
        outcomes. CANCELLED_BY_* — withdrawn.

    Appointment:
      type: object
      required: [id, status, patient, doctorId, sessionId, slotId, date, createdAt, createdVia]
      properties:
        id: { type: string }
        confirmationCode: { type: string }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        patient:
          type: object
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { $ref: '#/components/schemas/Phone' }
            relationToCaller: { type: string, nullable: true }
        callerNumber: { type: string, nullable: true, description: Network number the booking was made from. Staff scope only. }
        doctorId: { type: string }
        sessionId: { type: string }
        slotId: { type: string }
        date: { type: string, format: date }
        slot: { $ref: '#/components/schemas/Slot' }
        arriveBy:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
        timingCertainty: { $ref: '#/components/schemas/TimingCertainty' }
        confirmedStart:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
        reasonVerbatim: { type: string, nullable: true, description: Staff scope only. }
        language: { $ref: '#/components/schemas/Language' }
        createdVia: { type: string, enum: [AGENT, DESK, WEB] }
        callId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        history:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              by: { type: string }
              change: { type: string }

    ImpactedAppointment:
      type: object
      required: [appointment, notification]
      properties:
        appointment: { $ref: '#/components/schemas/Appointment' }
        notification: { $ref: '#/components/schemas/Notification' }

    Notification:
      type: object
      required: [id, appointmentId, trigger, status, createdAt]
      properties:
        id: { type: string }
        appointmentId: { type: string }
        trigger: { type: string, enum: [SESSION_CANCELLED, SESSION_TIME_CHANGED, TEMPLATE_CHANGED, DESK_MESSAGE] }
        status: { type: string, enum: [PENDING, SENT, FAILED, ACKNOWLEDGED] }
        channel: { type: string, nullable: true, enum: [PHONE, SMS, WHATSAPP, IN_PERSON, VOICE_BOT] }
        patientPhone: { $ref: '#/components/schemas/Phone' }
        patientLanguage: { $ref: '#/components/schemas/Language' }
        facts:
          type: object
          description: "Structured facts for the outbound message (never prose): doctor, old and new session, suggested slots."
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }
        outcome: { type: string, nullable: true, enum: [INFORMED, RESCHEDULED, CANCELLED, NO_ANSWER] }

    # ---------- calls ----------

    CallSummary:
      type: object
      required: [callId, startedAt, intent, outcome]
      properties:
        id: { type: string }
        callId: { type: string }
        startedAt: { type: string, format: date-time }
        durationSeconds: { type: integer }
        language: { $ref: '#/components/schemas/Language' }
        callerNumber: { type: string, nullable: true }
        intent: { type: string, enum: [AVAILABILITY, BOOKING, RESCHEDULE, CANCEL, LOOKUP, GENERAL_INFO, LAB, PHARMACY, INSURANCE, EMERGENCY, SYMPTOM_ROUTING, ADMIN, OTHER] }
        outcome: { type: string, enum: [RESOLVED_BY_AGENT, APPOINTMENT_BOOKED, APPOINTMENT_CANCELLED, APPOINTMENT_RESCHEDULED, TRANSFERRED, EMERGENCY_TRANSFERRED, ABANDONED] }
        transferredTo: { type: string, nullable: true }
        appointmentId: { type: string, nullable: true }
        toolOutcomes:
          type: object
          additionalProperties: { type: string }
        summaryText: { type: string, maxLength: 500 }

    # ---------- errors ----------

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED, NOT_FOUND, UNAUTHORIZED, FORBIDDEN, CONFLICT, IDEMPOTENCY_CONFLICT, SLOT_UNAVAILABLE, RATE_LIMITED, INTERNAL, SERVICE_UNAVAILABLE, UPSTREAM_TIMEOUT]
            message: { type: string, description: "Safe to log; never contains another patient's data." }
            details:
