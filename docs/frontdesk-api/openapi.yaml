        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LexiconEntryInput' }
            example:
              conceptType: CATEGORY
              conceptId: cat_genmed
              term: "thyroid doctor"
              language: en
              approved: true
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LexiconEntry' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ===========================================================================
  # SCHEDULING — the plan, the reality, and right now
  # ===========================================================================

  /resources/{resourceId}/schedule-template:
    get:
      tags: [Scheduling]
      operationId: getScheduleTemplate
      summary: The resource's recurring sessions
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleTemplate' }
              example:
                resourceId: res_garima
                effectiveFrom: "2026-09-01"
                effectiveTo: null
                sessions:
                  - templateSessionId: tpl_res_garima_am
                    label: Morning
                    daysOfWeek: [MON, THU, FRI]
                    start: "09:00"
                    end: "12:00"
                    capacityModel: SEQUENCE
                    capacity: { mode: PER_HOUR, value: 4 }
                    walkInReservePercent: 25
                    lastArrivalOffsetMinutes: 15
                  - templateSessionId: tpl_res_garima_pm
                    label: Afternoon
                    daysOfWeek: [MON, THU, FRI]
                    start: "15:00"
                    end: "17:00"
                    capacityModel: SEQUENCE
                    capacity: { mode: FIXED, value: 12 }
                    walkInReservePercent: 25
                    lastArrivalOffsetMinutes: 15
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Scheduling]
      operationId: setScheduleTemplate
      x-rules: ["RULE: effectiveFrom must not be before today (400).", "RULE: body resourceId must match the path (400).", "RULE: two sessions that share a weekday must not overlap in time (400)."]
      summary: Replace the resource's recurring sessions (admin/desk)
      description: >
        RULE: a new template takes effect from effectiveFrom; existing
        bookings before that date are untouched. Bookings on or after
        effectiveFrom that no longer fit a session become impacted (see
        /schedule-exceptions/{id}/impact semantics) and generate notifications.
      security:
        - oauth2: [schedule.write]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/ActingUser'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleTemplate' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleTemplate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schedule-exceptions:
    get:
      tags: [Scheduling]
      operationId: listScheduleExceptions
      summary: Known deviations from templates (leave, surgery, extra sessions)
      parameters:
        - name: resourceId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Exceptions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleException' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Scheduling]
      operationId: createScheduleException
      x-rules: ["RULE: dateFrom must not be before today (400): the past is never rewritten."]
      summary: Record reality — today or any future date
      description: >
        WHY: "Dr. Garima has two surgeries this Thursday" is known on Monday.
        Record it now; availability for Thursday changes immediately and the
        impacted customers are computed. RULE: creating an exception that removes
        or shortens a session moves the affected bookings to status
        NEEDS_RESCHEDULE and creates a Notification per booking. When a queue
        (SEQUENCE) session only gets shorter, bookings whose position no longer
        exists first move, earliest in the queue first, to a free position the
        caller can still reach (today: its window ends at least 15 minutes from
        now, and the session still admits people) with a SESSION_TIME_CHANGED
        notification carrying previousSlotId; a desk-confirmed time is cleared by
        the move. Only those left over become NEEDS_RESCHEDULE. The reason
        category is internal; the agent never receives it.
      security:
        - oauth2: [schedule.write]
      parameters:
        - $ref: '#/components/parameters/ActingUser'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleExceptionInput' }
            examples:
              surgeryDay:
                summary: Whole afternoon unavailable on a future date
                value:
                  resourceId: res_garima
                  dateFrom: "2026-10-01"
                  dateTo: "2026-10-01"
                  scope: SESSION
                  templateSessionId: tpl_res_garima_pm
                  effect: UNAVAILABLE
                  reasonCategory: OTHER_DUTY
              startsLate:
                summary: Same-day time change
                value:
                  resourceId: res_garima
                  dateFrom: "2026-09-25"
                  dateTo: "2026-09-25"
                  scope: SESSION
                  templateSessionId: tpl_res_garima_am
                  effect: TIME_CHANGE
                  newStart: "10:00"
                  newEnd: "12:00"
                  reasonCategory: OTHER
              extraSunday:
                summary: Extra session on a non-template day
                value:
                  resourceId: res_garima
                  dateFrom: "2026-09-27"
                  dateTo: "2026-09-27"
                  scope: TIME_RANGE
                  effect: EXTRA_SESSION
                  newStart: "10:00"
                  newEnd: "12:00"
                  newCapacity: 8
                  reasonCategory: OTHER
      responses:
        '201':
          description: Recorded, with impact summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleException' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /schedule-exceptions/{exceptionId}:
    delete:
      tags: [Scheduling]
      operationId: deleteScheduleException
      summary: Withdraw an exception (the resource is coming after all)
      description: "RULE: bookings moved to NEEDS_RESCHEDULE by this exception return to BOOKED if their slot still fits; otherwise they stay and are re-notified."
      security:
        - oauth2: [schedule.write]
      parameters:
        - name: exceptionId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/ActingUser'
      responses:
        '204': { description: Withdrawn. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schedule-exceptions/{exceptionId}/impact:
    get:
      tags: [Scheduling]
      operationId: getScheduleExceptionImpact
      summary: Bookings impacted by an exception, with notification state
      description: "WHY: this is the outbound-call list. Staff today; SMS/voice bot later."
      security:
        - oauth2: [bookings.staff]
      parameters:
        - name: exceptionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Impacted bookings.
          content:
            application/json:
              schema:
                type: object
                required: [exceptionId, items]
                properties:
                  exceptionId: { type: string }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ImpactedBooking' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /board/{resourceId}:
    get:
      tags: [Scheduling]
      operationId: getBoard
      summary: Live board for one resource on a date (right now facts)
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Board entries per session.
          content:
            application/json:
              schema:
                type: object
                required: [resourceId, date, sessions]
                properties:
                  resourceId: { type: string }
                  date: { type: string, format: date }
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/BoardEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Scheduling]
      operationId: setBoard
      summary: Desk marks arrived / late / left / full for a session (today)
      description: >
        WHY: the board is same-day operational truth: the resource arrived, is 30
        minutes late, has left, the list is full. It never changes the template.
        RULE: presence=LEFT or sessionEnded=true makes the session unbookable for
        the rest of the day. RULE: capacityState=FULL closes remaining slots.
        Board facts expire at end of day.
      security:
        - oauth2: [board.write]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/ActingUser'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoardEntryInput' }
            example:
              date: "2026-09-25"
              sessionId: ses_res_garima_2026-09-25_1
              presence: ARRIVING
              expectedStart: "09:20"
              delayMinutes: 20
      responses:
        '200':
          description: Updated entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardEntry' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # AVAILABILITY — computed, read-only, same engine the agent uses
  # ===========================================================================

  /availability:
    get:
      tags: [Availability]
      operationId: getAvailability
      summary: Materialised sessions with slots for a resource or category over a date range
      description: >
        RULE (the availability algorithm, used by this endpoint and by
        agentAvailabilitySearch):
          1. For each date in [from,to], take template sessions whose daysOfWeek
             match and whose template is effective.
          2. Apply exceptions: UNAVAILABLE removes; TIME_CHANGE moves start/end;
             CAPACITY_CHANGE alters capacity; EXTRA_SESSION adds.
          3. If date is today, overlay the board: presence, expectedStart, delay,
             sessionEnded, capacityState.
          4. Capacity total = FIXED value, or PER_HOUR value × duration hours, or
             tenant default (capacitySource=DEFAULT). Bookable = total −
             walkInReserve. Slots = bookable positions (SEQUENCE) or fixed-length
             times (TIMED); mark each slot available/booked from bookings.
          5. arriveBy = min(lastArrivalTime from board, end − lastArrivalOffset).
             bookable=false with a reason when: ended, left, full, cancelled,
             arriveBy passed, or no session.
          6. timingCertainty: CONFIRMED if the desk confirmed this session
             (board or exception marked confirmed), EXPECTED if from template
             only, NOT_CONFIRMED if the desk flagged it pending. dataConfirmed
             =false on the resource caps certainty at EXPECTED.
        Never cached across requests; always computed.
      parameters:
        - name: resourceId
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: includeSlots
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Session instances.
          content:
            application/json:
              schema:
                type: object
                required: [asOf, items]
                properties:
                  asOf: { type: string, format: date-time }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SessionInstance' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ===========================================================================
  # BOOKINGS — staff side
  # ===========================================================================

  /bookings:
    get:
      tags: [Bookings]
      operationId: searchBookings
      summary: Staff search (any filter)
      security:
        - oauth2: [bookings.staff]
      parameters:
        - name: resourceId
          in: query
          schema: { type: string }
        - name: sessionId
          in: query
          schema: { type: string }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: phone
          in: query
          schema: { $ref: '#/components/schemas/Phone' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Bookings.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }
                  total: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Bookings]
      operationId: deskCreateBooking
      summary: Desk books on behalf of a walk-in or phone caller
      description: Same slot rules as the agent path; createdVia=DESK; no caller-number check.
      security:
        - oauth2: [bookings.staff]
      parameters:
        - $ref: '#/components/parameters/ActingUser'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentBookRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SlotConflict' }

  /bookings/{bookingId}:
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: One booking, full detail (staff)
      security:
        - oauth2: [bookings.staff]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bookings/{bookingId}/confirm:
    post:
      tags: [Bookings]
      operationId: confirmBooking
      summary: Desk confirms the timing with the resource
      description: Sets timingCertainty=CONFIRMED on the booking (and optionally the session). The only state the agent may voice as "confirmed".
      security:
        - oauth2: [bookings.staff]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/ActingUser'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmedStart: { $ref: '#/components/schemas/ClockTime' }
                applyToSession: { type: boolean, default: false }
      responses:
        '200':
          description: Confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bookings/{bookingId}/status:
    post:
      tags: [Bookings]
      operationId: setBookingStatus
      summary: Desk marks arrived / completed / no-show, or cancels on the hospital's behalf
      security:
        - oauth2: [bookings.staff]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/ActingUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ARRIVED, COMPLETED, NO_SHOW, CANCELLED_BY_PROVIDER]
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ===========================================================================
  # NOTIFICATIONS — impacted customers (outbound later)
  # ===========================================================================

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Pending and sent notifications to impacted customers
      security:
        - oauth2: [bookings.staff]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, SENT, FAILED, ACKNOWLEDGED], default: PENDING }
        - name: resourceId
          in: query
          schema: { type: string }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Notifications.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notifications/{notificationId}/delivered:
    post:
      tags: [Notifications]
      operationId: markNotificationDelivered
      summary: Record that the customer was informed (by desk today, by SMS/voice bot later)
      security:
        - oauth2: [bookings.staff]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/ActingUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [PHONE, SMS, WHATSAPP, IN_PERSON, VOICE_BOT] }
                outcome: { type: string, enum: [INFORMED, RESCHEDULED, CANCELLED, NO_ANSWER] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # CALLS
  # ===========================================================================

  /call-summaries:
    post:
      tags: [Calls]
      operationId: storeCallSummary
      summary: Voice platform posts a summary when a call ends
      security:
        - oauth2: [calls.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallSummary' }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallSummary' }
        '200':
          description: Same callId already stored; returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [Calls]
      operationId: listCallSummaries
      x-rules: ["RULE: from and to are facility-local days; to before from is 400. Newest first, ties by id."]
      summary: Admin UI listing
      security:
        - oauth2: [calls.read]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Summaries.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CallSummary' }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  securitySchemes:
    oauth2:
      type: oauth2
      description: Client credentials per consumer; tenant bound to the credential.
      flows:
        clientCredentials:
          tokenUrl: https://auth.example-product.com/oauth2/token
          scopes:
            agent: Voice agent facade (all /agent operations)
            directory.write: Manage resources, categories, lexicon
            schedule.write: Manage templates and exceptions
            board.write: Update the live board
            bookings.staff: Staff booking operations, impact lists, notifications
            knowledge.write: Manage the knowledge base (approved answers)
            calls.write: Store call summaries
            calls.read: Read call summaries

  parameters:
    CallId:
      name: X-Call-Id
      in: header
      required: true
      description: Voice platform call id. Injected by the MCP layer; never a model argument.
      schema: { type: string, maxLength: 64 }
    CallerNumber:
      name: X-Caller-Number
      in: header
      required: false
      description: >
        Network caller number in E.164 from SIP, injected by the MCP layer.
        Absent for withheld or landline callers. Never a model argument.
      schema: { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required on the agent path. Replay returns 200 + Idempotent-Replay. Retained 24 h.
      schema: { type: string, maxLength: 64 }
    ActingUser:
      name: X-Acting-User
      in: header
      required: true
      description: Staff identity for audit.
      schema: { type: string, maxLength: 64 }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: string }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    ValidationFailed:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Missing scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found, or on verified operations the caller number or customer name did not match. Indistinguishable on purpose.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State does not allow the operation, or idempotency conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SlotConflict:
      description: >
        SLOT_UNAVAILABLE: the slot was taken or the session changed since it
        was offered. details.currentSlots carries the session's current
        bookable slots so the agent can re-offer without another search.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: SLOT_UNAVAILABLE
              message: "Slot already booked"
              currentSlots:
                - { slotId: slot_ses_res_garima_2026-09-26_2_05, kind: SEQUENCE, position: 5, expectedWindow: { from: "15:40", to: "15:50" }, available: true }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: Unexpected error. Nothing may be inferred about the data.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Temporarily unavailable.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamTimeout:
      description: Write did not complete within 5 s. Retry once with the same Idempotency-Key; never with a new one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ---------- primitives ----------

    Language:
      type: string
      description: BCP-47 primary tag as reported by STT (en, kn, hi, ta, te, ...). Not restricted to three.
      example: kn

    LocalizedText:
      type: object
      description: Approved display text per language. Keys are Language values. The agent speaks the entry matching the caller's language when present, else the canonical name.
      additionalProperties: { type: string }
      example: { kn: "ಚರ್ಮರೋಗ ವಿಭಾಗ", hi: "त्वचा विभाग" }

    Attributes:
      type: object
      description: >
        Facts about a resource defined by the domain pack, safe to speak. Healthcare uses
        qualification and yearsOfExperience; hospitality might use speciality or cuisine.
      additionalProperties:
        oneOf: [{ type: string }, { type: number }, { type: boolean }]
      example: { qualification: "MBBS, MD - General Medicine", yearsOfExperience: 12 }

    Phone:
      type: string
      description: Contact number as dictated, digits only, national format for the tenant (10 digits for the first tenant). Distinct from X-Caller-Number.
      pattern: '^[0-9]{6,15}$'
      example: "9876543210"

    ClockTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: "15:30"

    Money:
      type: object
      required: [amount, currency, confirmed]
      properties:
        amount: { type: number }
        currency: { type: string, example: INR }
        confirmed:
          type: boolean
          description: False until the hospital approves the value. RULE — agent responses (search results, bookings) carry a price only when confirmed; staff responses show the draft.

    Gender:
      type: string
      enum: [FEMALE, MALE]

    DayOfWeek:
      type: string
      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]

    DayPart:
      type: string
      enum: [MORNING, AFTERNOON, EVENING, ANY]
      description: Tenant maps these to clock ranges (e.g. MORNING 06:00-12:00, AFTERNOON 12:00-17:00, EVENING 17:00-23:00).

    # ---------- directory ----------

    Category:
      type: object
      required: [id, name, offersBookings, active]
      properties:
        id: { type: string, example: cat_derm }
        code: { type: string, example: DERM }
        name: { type: string, example: Dermatology }
        localizedNames: { $ref: '#/components/schemas/LocalizedText' }
        offersBookings: { type: boolean, description: False means never offer or route. }
        active: { type: boolean }

    CategoryInput:
      type: object
      required: [name]
      properties:
        code: { type: string, nullable: true }
        name: { type: string, maxLength: 100 }
        localizedNames: { $ref: '#/components/schemas/LocalizedText' }
        offersBookings: { type: boolean, default: true }
        active: { type: boolean, default: true }

    Resource:
      type: object
      required: [id, name, categories, active, dataConfirmed]
      properties:
        id: { type: string, example: res_garima }
        name: { type: string, example: "Dr. Garima" }
        localizedNames: { $ref: '#/components/schemas/LocalizedText' }
        nameVariants:
          type: array
          items: { type: string }
          description: Spellings and transliterations heard from callers; fed to the phonetic index. Maintained by the hospital and auto-augmented by transliteration.
        gender:
          allOf: [{ $ref: '#/components/schemas/Gender' }]
          nullable: true
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        attributes: { $ref: '#/components/schemas/Attributes' }
        languagesSpoken:
          type: array
          items: { $ref: '#/components/schemas/Language' }
        price:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        attendanceType:
          type: string
          enum: [REGULAR, VISITING, ON_CALL]
          description: ON_CALL resources have no template; availability comes only from exceptions of effect EXTRA_SESSION or the board.
        bookingPolicy:
          type: string
          enum: [BOOKABLE, DESK_ONLY, NOT_OFFERED]
          description: DESK_ONLY means the agent may show sessions but must transfer to book. NOT_OFFERED means never offer.
        dataConfirmed:
          type: boolean
          description: False while the hospital has not signed off this row. Caps timingCertainty at EXPECTED.
        active: { type: boolean }

    ResourceInput:
      type: object
      required: [name, categoryIds]
      properties:
        name: { type: string }
        localizedNames: { $ref: '#/components/schemas/LocalizedText' }
        nameVariants:
          type: array
          items: { type: string }
        gender:
          allOf: [{ $ref: '#/components/schemas/Gender' }]
          nullable: true
        categoryIds:
          type: array
          items: { type: string }
        attributes: { $ref: '#/components/schemas/Attributes' }
        languagesSpoken:
          type: array
          items: { $ref: '#/components/schemas/Language' }
        price:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        attendanceType: { type: string, enum: [REGULAR, VISITING, ON_CALL] }
        bookingPolicy: { type: string, enum: [BOOKABLE, DESK_ONLY, NOT_OFFERED] }
        dataConfirmed: { type: boolean }
        active: { type: boolean }

    LexiconConceptType:
      type: string
      enum: [CATEGORY, RESOURCE, NEED_ROUTE, RED_FLAG, DAY_PART, SERVICE_TRANSFER]
      description: >
        CATEGORY: a way callers name a category. RESOURCE: a way callers say a
        resource's name. NEED_ROUTE: hospital-approved need phrase → category
        (thyroid → General Medicine). RED_FLAG: emergency phrase → TRANSFER_EMERGENCY.
        DAY_PART: "evening", "ಸಂಜೆ", "shaam" → EVENING. SERVICE_TRANSFER: lab,
        pharmacy, insurance → TRANSFER_DESK with a destination.

    LexiconEntry:
      type: object
      required: [id, conceptType, conceptId, term, language, approved]
      properties:
        id: { type: string }
        conceptType: { $ref: '#/components/schemas/LexiconConceptType' }
        conceptId:
          type: string
          description: Category id, resource id, DayPart value, or transfer destination code.
        term: { type: string, description: 'The phrase as callers say it, any script.' }
        termNormalized: { type: string, description: 'Server-computed: NFC, lower-case, transliterated to Latin.' }
        language: { $ref: '#/components/schemas/Language' }
        approved: { type: boolean }
        source:
          type: string
          enum: [PROVIDER, DOMAIN_BASELINE, TRANSCRIPT_MINED, AUTO_TRANSLITERATION]
          description: >-
            DOMAIN_BASELINE rows come from the domain pack (`frontdesk-api rollout apply`); a
            provider may switch one off with approved=false, except a RED_FLAG, which stays on.

    LexiconEntryInput:
      type: object
      required: [conceptType, conceptId, term, language]
      properties:
        conceptType: { $ref: '#/components/schemas/LexiconConceptType' }
        conceptId: { type: string }
        term: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        approved: { type: boolean, default: false }

    # ---------- scheduling: plan ----------

    CapacitySpec:
      type: object
      required: [mode]
      description: >
        How many customers a session can take. FIXED: value is the total.
        PER_HOUR: total = value × session hours. DEFAULT: tenant default applies
        (flagged in results as capacitySource=DEFAULT so the hospital knows it
        is a guess to be corrected).
      properties:
        mode: { type: string, enum: [FIXED, PER_HOUR, DEFAULT] }
        value: { type: integer, minimum: 1, nullable: true }

    TemplateSession:
      type: object
      required: [templateSessionId, daysOfWeek, start, end, capacityModel, capacity]
      properties:
        templateSessionId: { type: string, example: tpl_res_garima_am }
        label: { type: string, example: Morning }
        daysOfWeek:
          type: array
          items: { $ref: '#/components/schemas/DayOfWeek' }
        start: { $ref: '#/components/schemas/ClockTime' }
        end: { $ref: '#/components/schemas/ClockTime' }
        capacityModel:
          type: string
          enum: [SEQUENCE, TIMED]
          description: >
            SEQUENCE: customers seen in arrival/booking order; a slot is a
            position with an expected window (token OPD). TIMED: a slot is a
            fixed-length reserved time (specialist clinics, scans).
        slotMinutes:
          type: integer
          nullable: true
          description: TIMED only. Length of each slot.
        capacity: { $ref: '#/components/schemas/CapacitySpec' }
        walkInReservePercent:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Share of capacity never offered to phone bookings, kept for walk-ins.
        lastArrivalOffsetMinutes:
          type: integer
          minimum: 0
          default: 15
          description: arriveBy = end − this, unless the desk sets an earlier lastArrivalTime.

    ScheduleTemplate:
      type: object
      required: [resourceId, effectiveFrom, sessions]
      properties:
        resourceId: { type: string }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date, nullable: true }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/TemplateSession' }

    # ---------- scheduling: reality ----------

    ScheduleExceptionInput:
      type: object
      required: [resourceId, dateFrom, dateTo, scope, effect]
      properties:
        resourceId: { type: string }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        scope:
          type: string
          enum: [WHOLE_DAY, SESSION, TIME_RANGE]
          description: WHOLE_DAY affects every session that day. SESSION targets templateSessionId. TIME_RANGE targets newStart–newEnd (used with EXTRA_SESSION or a partial block).
        templateSessionId: { type: string, nullable: true }
        effect:
          type: string
          enum: [UNAVAILABLE, TIME_CHANGE, CAPACITY_CHANGE, EXTRA_SESSION, TIMING_PENDING, TIMING_CONFIRMED]
          description: >
            UNAVAILABLE removes the session(s). TIME_CHANGE moves them to
            newStart–newEnd. CAPACITY_CHANGE sets newCapacity. EXTRA_SESSION
            adds a session on a day the template does not have one.
            TIMING_PENDING marks the session as not yet confirmed by the resource
            (agent hears NOT_CONFIRMED). TIMING_CONFIRMED marks it confirmed.
        newStart: { $ref: '#/components/schemas/ClockTime' }
        newEnd: { $ref: '#/components/schemas/ClockTime' }
        newCapacity: { type: integer, minimum: 0, nullable: true }
        reasonCategory:
          type: string
          enum: [LEAVE, OTHER_DUTY, EVENT, PERSONAL, OTHER]
          description: Internal. Never returned on the agent path.
        note: { type: string, maxLength: 500, description: Internal. }

    ScheduleException:
      allOf:
        - $ref: '#/components/schemas/ScheduleExceptionInput'
        - type: object
          required: [id, createdAt, createdBy, impact]
          properties:
            id: { type: string, example: exc_0042 }
            createdAt: { type: string, format: date-time }
            createdBy: { type: string }
            impact:
              type: object
              required: [bookingsImpacted, notificationsCreated]
              properties:
                bookingsImpacted: { type: integer }
                notificationsCreated: { type: integer }

    # ---------- scheduling: right now ----------

    Presence:
      type: string
      enum: [NOT_ARRIVED, ARRIVING, PRESENT, LEFT]

    BoardEntryInput:
      type: object
      required: [date, sessionId]
      properties:
        date: { type: string, format: date }
        sessionId: { type: string }
        presence: { $ref: '#/components/schemas/Presence' }
        expectedStart: { $ref: '#/components/schemas/ClockTime' }
        delayMinutes: { type: integer, minimum: 0 }
        sessionEnded: { type: boolean }
        capacityState: { type: string, enum: [OPEN, FULL] }
        tokensIssued:
          type: integer
          minimum: 0
          description: Walk-in tokens issued so far, if the desk records it. Informational.
        lastArrivalTime: { $ref: '#/components/schemas/ClockTime' }
        timingConfirmed: { type: boolean, description: Desk has confirmed today's timing with the resource. }

    BoardEntry:
      allOf:
        - $ref: '#/components/schemas/BoardEntryInput'
        - type: object
          required: [updatedAt, updatedBy]
          properties:
            updatedAt: { type: string, format: date-time }
            updatedBy: { type: string, description: Staff scope only. }

    # ---------- availability: computed ----------

    TimingCertainty:
      type: string
      enum: [CONFIRMED, EXPECTED, NOT_CONFIRMED]
      description: CONFIRMED — desk confirmed with the resource. EXPECTED — from the template. NOT_CONFIRMED — desk flagged pending.

    NotBookableReason:
      type: string
      enum: [SESSION_ENDED, LEFT_FOR_DAY, ARRIVE_BY_PASSED, FULL, CANCELLED, NO_SESSION_THAT_DAY, NO_SESSION_IN_DAY_PART, ON_CALL_ONLY, DESK_ONLY, NOT_OFFERED]
      description: NO_SESSION_IN_DAY_PART — the resource sits that day, but not in the part of the day asked for (nextBookable may be the same day).

    Slot:
      type: object
      required: [slotId, kind, available]
      properties:
        slotId: { type: string, example: slot_ses_res_garima_2026-09-26_2_04 }
        kind: { type: string, enum: [SEQUENCE, TIMED] }
        position: { type: integer, minimum: 1, nullable: true, description: SEQUENCE only. }
        start:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
          description: TIMED only.
        end:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
          description: TIMED only.
        expectedWindow:
          type: object
          nullable: true
          description: >-
            SEQUENCE only; spoken as "around". Adjacent boundaries are computed from
            the session's expected start using floor(position * intervalMinutes).
            PER_HOUR uses 60 / capacity.value; FIXED and DEFAULT use session duration
            / resolved total capacity, before walk-in reserves or bookings. Each
            window ends at the next boundary, clamped to session end. Sub-minute
            capacity intervals cannot be offered with the HH:MM representation.
          properties:
            from: { $ref: '#/components/schemas/ClockTime' }
            to: { $ref: '#/components/schemas/ClockTime' }
        available: { type: boolean }

    SessionInstance:
      type: object
      required: [sessionId, resourceId, date, start, end, status, timingCertainty, capacityModel, capacity, bookable]
      properties:
        sessionId: { type: string, example: ses_res_garima_2026-09-26_2 }
        resourceId: { type: string }
        templateSessionId: { type: string, nullable: true }
        date: { type: string, format: date }
        label: { type: string }
        start: { $ref: '#/components/schemas/ClockTime' }
        end: { $ref: '#/components/schemas/ClockTime' }
        status:
          type: string
          enum: [SCHEDULED, CHANGED, CANCELLED, ENDED]
          description: CHANGED means an exception moved it from the template.
        timingCertainty: { $ref: '#/components/schemas/TimingCertainty' }
        presence:
          allOf: [{ $ref: '#/components/schemas/Presence' }]
          nullable: true
          description: Today only.
        expectedStart:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
        delayMinutes: { type: integer, nullable: true }
        capacityModel: { type: string, enum: [SEQUENCE, TIMED] }
        capacity:
          type: object
          required: [total, booked, remaining]
          properties:
            total: { type: integer }
            booked: { type: integer }
            remaining: { type: integer, description: Bookable by phone = total − walk-in reserve − booked. }
            walkInReserve: { type: integer }
            capacitySource: { type: string, enum: [FIXED, PER_HOUR, DEFAULT] }
        arriveBy:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
        bookable: { type: boolean }
        notBookableReason:
          allOf: [{ $ref: '#/components/schemas/NotBookableReason' }]
          nullable: true
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }

    # ---------- agent facade ----------

    AvailabilitySearchRequest:
      type: object
      required: [utterance, language]
      description: >
        Everything optional except the caller's words. The LLM fills what it
        heard; the server does the understanding. Fields may be in any language
        or script. Nothing here is an id — the LLM never invents ids.
      properties:
        utterance:
          type: string
          maxLength: 500
          description: The caller's request verbatim (as STT delivered it).
        language: { $ref: '#/components/schemas/Language' }
        resourceName: { type: string, maxLength: 100, description: If the caller named a resource. As heard. }
        category: { type: string, maxLength: 100, description: If the caller named a speciality or category. As heard. }
        needText: { type: string, maxLength: 300, description: If the caller described a problem. As heard. Server maps via approved NEED_ROUTE only. }
        when:
          type: object
          description: Either an expression ("tomorrow evening", "ನಾಳೆ", "kal shaam") or explicit dates. Server resolves in facility time.
          properties:
            expression: { type: string, maxLength: 100 }
            dateFrom: { type: string, format: date }
            dateTo: { type: string, format: date }
            dayPart: { $ref: '#/components/schemas/DayPart' }
        preferences:
          type: object
          properties:
            gender: { $ref: '#/components/schemas/Gender' }
            language: { $ref: '#/components/schemas/Language' }
        maxResources: { type: integer, minimum: 1, maximum: 5, default: 3 }
        maxSlotsPerSession: { type: integer, minimum: 1, maximum: 5, default: 3 }

    Understood:
      type: object
      description: What the server made of the words. Returned so the agent can confirm ("Dr. Garima, tomorrow evening?").
      required: [resources, categories]
      properties:
        resources:
          type: array
          items:
            type: object
            required: [resourceId, name, confidence, matchedOn]
            properties:
              resourceId: { type: string }
              name: { type: string }
              localizedNames: { $ref: '#/components/schemas/LocalizedText' }
              confidence: { type: number, minimum: 0, maximum: 1 }
              matchedOn: { type: string, enum: [NAME_EXACT, NAME_PHONETIC, NAME_VARIANT, LEXICON] }
        categories:
          type: array
          items:
            type: object
            required: [id, name, confidence, matchedOn]
            properties:
              id: { type: string }
              name: { type: string }
              localizedNames: { $ref: '#/components/schemas/LocalizedText' }
              confidence: { type: number, minimum: 0, maximum: 1 }
              matchedOn:
                type: string
                enum: [LEXICON, NEED_ROUTE, SEMANTIC, FORMER_RESOURCE]
                description: FORMER_RESOURCE — the caller named a resource that no longer takes bookings; this is its category, and notes say so.
        dates:
          type: object
          nullable: true
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        dayPart:
          allOf: [{ $ref: '#/components/schemas/DayPart' }]
          nullable: true

    Routing:
      type: object
      required: [action]
      description: >
        The next thing the agent should do. OFFER_SLOTS — read results.
        CLARIFY — ask the question in clarification. TRANSFER_EMERGENCY — a
        RED_FLAG matched; stop and transfer. TRANSFER_DESK — request is not a
        consultation (lab, pharmacy, insurance) or the resource is DESK_ONLY;
        destination given. NO_SERVICE — not understood, or not offered here
        (no such category, no consultant); outcome is TRANSFER with
        destination desk: ask the caller to rephrase once or transfer, and
        never say that nobody is available.
      properties:
        action: { type: string, enum: [OFFER_SLOTS, CLARIFY, TRANSFER_EMERGENCY, TRANSFER_DESK, NO_SERVICE] }
        destination: { type: string, nullable: true, description: Transfer destination code from tenant telephony config. }

    Clarification:
      type: object
      nullable: true
      required: [type, options]
      properties:
        type:
          type: string
          enum: [WHICH_RESOURCE, WHICH_CATEGORY, WHICH_DATE, WHICH_CUSTOMER, CONFIRM_INTERPRETATION]
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
              localizedLabels: { $ref: '#/components/schemas/LocalizedText' }
              detail: { type: string, nullable: true, description: "The category for a resource option. When two options would read the same, the usual days and hours of each (\"Cardiology, MON WED FRI 10:00-13:00\") from the template in force on the first requested date, only for resources whose data is confirmed. It tells the options apart; it is not availability." }

    ResourceResult:
      type: object
      required: [resource, sessions, unavailable]
      properties:
        resource:
          type: object
          required: [resourceId, name, categories, dataConfirmed]
          properties:
            resourceId: { type: string }
            name: { type: string }
            localizedNames: { $ref: '#/components/schemas/LocalizedText' }
            categories:
              type: array
              items: { $ref: '#/components/schemas/Category' }
            gender:
              allOf: [{ $ref: '#/components/schemas/Gender' }]
              nullable: true
            attributes: { $ref: '#/components/schemas/Attributes' }
            price:
              allOf: [{ $ref: '#/components/schemas/Money' }]
              nullable: true
            dataConfirmed: { type: boolean }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionInstance' }
        unavailable:
          type: array
          description: Sessions in range that cannot be booked, with the reason and the next bookable session.
          items:
            type: object
            required: [date, reason]
            properties:
              date: { type: string, format: date }
              sessionId: { type: string, nullable: true }
              reason: { $ref: '#/components/schemas/NotBookableReason' }
              nextBookable:
                type: object
                nullable: true
                properties:
                  date: { type: string, format: date }
                  start: { $ref: '#/components/schemas/ClockTime' }
                  end: { $ref: '#/components/schemas/ClockTime' }

    AvailabilitySearchResponse:
      type: object
      required: [outcome, asOf, routing, understood, results, alternatives]
      properties:
        outcome:
          type: string
          enum: [FOUND, NONE_AVAILABLE, CLARIFICATION_NEEDED, TRANSFER, COULD_NOT_CHECK]
          description: The one field the agent branches on.
        asOf: { type: string, format: date-time }
        routing: { $ref: '#/components/schemas/Routing' }
        understood: { $ref: '#/components/schemas/Understood' }
        clarification: { $ref: '#/components/schemas/Clarification' }
        results:
          type: array
          items: { $ref: '#/components/schemas/ResourceResult' }
        alternatives:
          type: array
          description: Same-category resources with bookable sessions when the requested resource has none.
          items: { $ref: '#/components/schemas/ResourceResult' }
        partial:
          type: boolean
          description: True when part of the data could not be fetched; see notes.
        notes:
          type: array
          items: { type: string }

    AgentBookRequest:
      type: object
      required: [slotId, customer, language]
      properties:
        slotId: { type: string }
        customer:
          type: object
          required: [name, phone]
          properties:
            name: { type: string, maxLength: 100, description: As spoken and spelled back. }
            phone:
              allOf: [{ $ref: '#/components/schemas/Phone' }]
              description: Dictated and read back. Never defaulted from the caller number.
            relationToCaller:
              type: string
              enum: [SELF, CHILD, PARENT, SPOUSE, OTHER]
              nullable: true
        reasonVerbatim: { type: string, maxLength: 500, description: "Caller's words, any language. Never an interpretation." }
        language: { $ref: '#/components/schemas/Language' }
        requestTimingConfirmation:
          type: boolean
          default: false
          description: Caller wants the desk to confirm timing when the session is NOT_CONFIRMED. Honoured only if the tenant works that list.

    AgentBooking:
      type: object
      required: [outcome, bookingId, status, customer, resource, date, session, slot, timingCertainty]
      properties:
        outcome:
          type: string
          enum: [BOOKED, ALREADY_BOOKED, CANCELLED, ALREADY_CANCELLED, RESCHEDULED, FOUND]
          description: ALREADY_CANCELLED — the booking was cancelled before this request; status says whether by the customer or the provider.
        bookingId: { type: string }
        confirmationCode:
          type: string
          description: Short code the agent reads back; lets a caller identify a booking on a later call without exposing ids.
        status: { $ref: '#/components/schemas/BookingStatus' }
        customer:
          type: object
          properties:
            name: { type: string }
            phone: { $ref: '#/components/schemas/Phone' }
        resource:
          type: object
          properties:
            resourceId: { type: string }
            name: { type: string }
            localizedNames: { $ref: '#/components/schemas/LocalizedText' }
        category: { $ref: '#/components/schemas/Category' }
        date: { type: string, format: date }
        session:
          type: object
          properties:
            sessionId: { type: string }
            label: { type: string }
            start: { $ref: '#/components/schemas/ClockTime' }
            end: { $ref: '#/components/schemas/ClockTime' }
        slot: { $ref: '#/components/schemas/Slot' }
        previousSlot:
          allOf: [{ $ref: '#/components/schemas/Slot' }]
          nullable: true
        arriveBy:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
        timingCertainty: { $ref: '#/components/schemas/TimingCertainty' }
        price:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        followUp:
          type: string
          enum: [NONE, DESK_WILL_CONFIRM_TIMING]
          description: The agent may promise a desk call only when this is DESK_WILL_CONFIRM_TIMING.
        resourceToday:
          allOf: [{ $ref: '#/components/schemas/SessionInstance' }]
          nullable: true
          description: Present on LIST for same-day bookings — answers "is my doctor coming?".

    AgentBookingList:
      type: object
      required: [outcome, items, customersOnNumber, identityBasis]
      properties:
        outcome: { type: string, enum: [FOUND, NONE_FOUND, NAME_REQUIRED, IDENTITY_UNAVAILABLE] }
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentBooking' }
        customersOnNumber: { type: integer }
        identityBasis: { type: string, enum: [CALLER_NUMBER, SPOKEN_NUMBER, NONE] }

    # ---------- bookings: full record ----------

    BookingStatus:
      type: string
      enum: [BOOKED, CONFIRMED_BY_DESK, RESCHEDULED, NEEDS_RESCHEDULE, ARRIVED, COMPLETED, NO_SHOW, CANCELLED_BY_CUSTOMER, CANCELLED_BY_PROVIDER]
      description: >
        BOOKED — slot held. CONFIRMED_BY_DESK — desk confirmed timing.
        RESCHEDULED — moved by customer. NEEDS_RESCHEDULE — session removed by an
        exception; customer to be notified. ARRIVED/COMPLETED/NO_SHOW — desk
        outcomes. CANCELLED_BY_* — withdrawn.

    Booking:
      type: object
      required: [id, status, customer, resourceId, sessionId, slotId, date, createdAt, createdVia]
      properties:
        id: { type: string }
        confirmationCode: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        customer:
          type: object
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { $ref: '#/components/schemas/Phone' }
            relationToCaller: { type: string, nullable: true }
        callerNumber: { type: string, nullable: true, description: Network number the booking was made from. Staff scope only. }
        resourceId: { type: string }
        sessionId: { type: string }
        slotId: { type: string }
        date: { type: string, format: date }
        slot: { $ref: '#/components/schemas/Slot' }
        arriveBy:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
        timingCertainty: { $ref: '#/components/schemas/TimingCertainty' }
        confirmedStart:
          allOf: [{ $ref: '#/components/schemas/ClockTime' }]
          nullable: true
        reasonVerbatim: { type: string, nullable: true, description: Staff scope only. }
        language: { $ref: '#/components/schemas/Language' }
        createdVia: { type: string, enum: [AGENT, DESK, WEB] }
        callId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        history:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              by: { type: string }
              change: { type: string }

    ImpactedBooking:
      type: object
      required: [booking, notification]
      properties:
        booking: { $ref: '#/components/schemas/Booking' }
        notification: { $ref: '#/components/schemas/Notification' }

    Notification:
      type: object
      required: [id, bookingId, trigger, status, createdAt]
      properties:
        id: { type: string }
        bookingId: { type: string }
        trigger: { type: string, enum: [SESSION_CANCELLED, SESSION_TIME_CHANGED, TEMPLATE_CHANGED, DESK_MESSAGE] }
        status: { type: string, enum: [PENDING, SENT, FAILED, ACKNOWLEDGED] }
        channel: { type: string, nullable: true, enum: [PHONE, SMS, WHATSAPP, IN_PERSON, VOICE_BOT] }
        customerPhone: { $ref: '#/components/schemas/Phone' }
        customerLanguage: { $ref: '#/components/schemas/Language' }
        facts:
          type: object
          description: "Structured facts for the outbound message (never prose): resource, old and new session, suggested slots. previousSlotId when the booking was moved to a free queue position; reason CAPACITY_REDUCED when the session kept its hours and only got smaller."
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }
        outcome: { type: string, nullable: true, enum: [INFORMED, RESCHEDULED, CANCELLED, NO_ANSWER] }

    # ---------- calls ----------

    CallSummary:
      type: object
      required: [callId, startedAt, intent, outcome]
      properties:
        id: { type: string }
        callId: { type: string }
        startedAt: { type: string, format: date-time, description: "Must carry a UTC offset (400 otherwise)." }
        durationSeconds: { type: integer }
        language: { $ref: '#/components/schemas/Language' }
        callerNumber: { type: string, nullable: true }
        intent: { type: string, enum: [AVAILABILITY, BOOKING, RESCHEDULE, CANCEL, LOOKUP, GENERAL_INFO, SERVICE_TRANSFER, EMERGENCY, NEED_ROUTING, ADMIN, OTHER] }
        outcome: { type: string, enum: [RESOLVED_BY_AGENT, BOOKING_CREATED, BOOKING_CANCELLED, BOOKING_RESCHEDULED, TRANSFERRED, EMERGENCY_TRANSFERRED, ABANDONED] }
        transferredTo: { type: string, nullable: true }
        bookingId: { type: string, nullable: true }
        toolOutcomes:
          type: object
          additionalProperties: { type: string }
        summaryText: { type: string, maxLength: 500 }

    # ---------- errors ----------

    KnowledgeSearchRequest:
      type: object
      required: [question, language]
      properties:
        question: { type: string, maxLength: 500, description: "The caller's question verbatim, as STT delivered it." }
        language: { $ref: '#/components/schemas/Language' }
        topic: { type: string, description: "Optional: restrict to one topic (e.g. after a clarification)." }

    KnowledgeSearchResponse:
      type: object
      required: [outcome, asOf, routing]
      properties:
        outcome:
          type: string
          enum: [ANSWERED, CLARIFICATION_NEEDED, NO_ANSWER, TRANSFER, COULD_NOT_CHECK]
        asOf: { type: string, format: date-time }
        routing:
          type: object
          required: [action]
          properties:
            action:
              type: string
              enum: [ANSWER, CLARIFY, TRANSFER_DESK, TRANSFER_EMERGENCY]
              description: TRANSFER_DESK after an ANSWERED outcome means "say the answer, then transfer".
            destination: { type: string, nullable: true }
        answer:
          type: object
          nullable: true
          required: [entryId, topic, text, language, source, confidence, matchedQuestion]
          properties:
            entryId: { type: string }
            topic: { type: string }
            text: { type: string, description: Approved wording. Speak as given. }
            language: { $ref: '#/components/schemas/Language' }
            source: { type: string, enum: [CURATED, DOCUMENT] }
            confidence: { type: number }
            matchedQuestion: { type: string }
        options:
          type: array
          nullable: true
          items:
            type: object
            required: [entryId, topic, label]
            properties:
              entryId: { type: string }
              topic: { type: string }
              label: { type: string, description: "The entry's own approved question in the caller's script (else its first question), not the variant that matched; ask \"did you mean …\"." }

    KnowledgeEntryInput:
      type: object
      required: [topic, questions, answers]
      properties:
        topic: { type: string, pattern: '^[a-z0-9_]+$', maxLength: 50 }
        questions:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, maxLength: 200 }
          description: Ways callers ask, in any language or script.
        answers:
          type: object
          additionalProperties: { type: string, maxLength: 1000 }
          description: Approved spoken answer per language.
        action: { type: string, enum: [ANSWER, TRANSFER_DESK], default: ANSWER }
        destination: { type: string, nullable: true, description: Required for TRANSFER_DESK; a transfer destination. }
        approved: { type: boolean, default: false }

    KnowledgeEntry:
      allOf:
        - $ref: '#/components/schemas/KnowledgeEntryInput'
        - type: object
          required: [id, source, updatedAt]
          properties:
            id: { type: string }
            source: { type: string, enum: [PROVIDER, DOCUMENT] }
            updatedAt: { type: string, format: date-time }

    KnowledgeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeEntry' }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED, NOT_FOUND, UNAUTHORIZED, FORBIDDEN, CONFLICT, IDEMPOTENCY_CONFLICT, SLOT_UNAVAILABLE, RATE_LIMITED, INTERNAL, SERVICE_UNAVAILABLE, UPSTREAM_TIMEOUT]
            message: { type: string, description: "Safe to log; never contains another customer's data." }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }
            currentSlots:
              type: array
              description: Present on SLOT_UNAVAILABLE.
              items: { $ref: '#/components/schemas/Slot' }
