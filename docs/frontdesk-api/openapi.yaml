# =============================================================================
# Front-Desk Operations API — designed from the voice agent inwards
# =============================================================================
#
# WHO THIS FILE IS FOR
#   1. The backend implementer (Python/Node + a database). Every path, schema,
#      rule and error you need is here. Comments marked RULE are behaviour the
#      server MUST implement; comments marked WHY explain the domain reason.
#   2. The MCP builder (FastMCP 2.14.x server, registered into the IBM
#      ContextForge fork as an MCP gateway). Only operations tagged `Agent`
#      become tools. Each carries an `x-mcp` block saying how. The mapping
#      between MCP tools and REST operations is in `x-mcp-tools` at the root.
#
# THE DOMAIN IN FOUR SENTENCES (domain-neutral; docs/architecture/TARGET.md)
#   A RESOURCE (a doctor, a therapist, a table) belongs to CATEGORIES (a
#   department, a service) and has a SCHEDULE TEMPLATE (recurring sessions:
#   "Mon/Thu/Fri 09:00-12:00 and 15:00-17:00"). Reality differs from the template
#   through SCHEDULE EXCEPTIONS (leave, other duty, extra session — known in
#   advance or on the day) and, on the day itself, the LIVE BOARD (arrived, late,
#   left). AVAILABILITY is never written: it is computed = template ⊕ exceptions ⊕
#   board ⊕ existing bookings, materialised into SESSION INSTANCES that contain
#   SLOTS. A BOOKING reserves exactly one slot for one CUSTOMER; when a session is
#   cancelled the bookings in it are the IMPACTED CUSTOMERS the provider must notify.
#
# DOMAIN PACKS
#   Healthcare is the first pack: resource = doctor, category = department,
#   customer = patient. Examples below use it. The words the LLM reads (tool
#   descriptions) come from the pack; this contract does not change per domain.
#
# TODAY VS FUTURE
#   Same endpoint, same shape. The only difference: today's sessions also carry
#   live-board facts (presence, delay). A future session simply has presence=null.
#   The agent never chooses between a "today" tool and a "future" tool.
#
# MULTILINGUAL
#   The caller speaks English, Kannada, Hindi or anything else; STT may deliver
#   native script, romanised text or an English translation, with proper nouns
#   mangled ("zoologist" for urologist). RULE: the agent passes the caller's
#   words verbatim plus a language hint; the SERVER resolves them against the
#   LEXICON (approved multilingual terms) with transliteration + phonetic +
#   semantic matching and answers with candidates and confidence. Aliases alone
#   are not the solution; they are one input to the resolver. Responses carry
#   `localizedNames` so the agent can speak the provider's approved wording in
#   the caller's language.
#
# CONVENTIONS
#   Base path /api/v1. JSON. Timestamps ISO 8601 with offset. Dates facility-local.
#   Tenant (facility) bound to the credential, never in the URL.
#   Agent calls carry X-Call-Id and X-Caller-Number headers, injected by the MCP
#   layer from trusted call context — never accepted from the model.
#   POST accepts Idempotency-Key; replay returns 200 + Idempotent-Replay: true.
#   Every date is between 2000-01-01 and 2100-12-31 (400 otherwise). Request bodies are
#   at most MAX_REQUEST_BYTES (64 KiB, 413) and nest at most 32 levels.
#   Every example is synthetic. "Dr. Garima" is the worked example from the brief.
# =============================================================================

openapi: 3.0.3
info:
  title: Front-Desk Operations API
  version: 2.0.0-draft
  description: >
    Domain API for a front-desk voice agent and the front-desk web application,
    reusable across domains through domain packs (healthcare first). Designed
    so that a conversational LLM needs at most three tools: one to find
    availability, one to manage a booking, one to answer general questions
    from approved answers. All business rules live here, never in the MCP
    layer or the prompt.
  contact:
    name: Front-desk platform workstream

servers:
  - url: https://{environment}.example-product.com/api/v1
    variables:
      environment:
        default: beta

tags:
  - name: Agent
    description: >
      The voice-agent facade. Free text in, computed facts out. These six
      operations are the only ones exposed as MCP tools.
  - name: Directory
    description: Resources, categories, and the multilingual lexicon.
  - name: Scheduling
    description: Schedule templates (the plan), schedule exceptions (reality), live board (right now).
  - name: Availability
    description: Computed, read-only. Session instances with slots, for staff and web.
  - name: Bookings
    description: Staff-side booking operations and impacted-customer handling.
  - name: Notifications
    description: Outbound notification queue for impacted customers (SMS/call later).
  - name: Knowledge
    description: >
      Approved answers to general questions (hours, parking, payment), in any
      language, maintained by staff. The agent reads them through
      agentKnowledgeSearch and never speaks unapproved text.
  - name: Calls
    description: Call summaries for the admin UI.

security:
  - oauth2: []

# -----------------------------------------------------------------------------
# MCP TOOL MAPPING (read by the MCP builder; ignored by the REST server)
# -----------------------------------------------------------------------------
# Three tools. All are thin wrappers over `Agent` operations. The wrapper adds
# nothing but: header injection from call context, an outcome envelope that is
# already the REST response, and stripping of the injected headers from the
# tool's input schema.
x-mcp-tools:
  find_availability:
    description: >
      Find which resources can be seen and when. Give the caller's words for the
      resource, category or problem exactly as spoken, and when they want to
      come. Returns understood meaning, bookable slots with times, price, and
      what to do next (offer slots, ask a clarifying question, or transfer).
    operations:
      - operationId: agentAvailabilitySearch
    inputs_from_context: [X-Call-Id, X-Caller-Number]
  manage_booking:
    description: >
      Book, list, cancel or reschedule a booking for the caller. Book uses a
      slotId from find_availability. List/cancel/reschedule are checked against
      the caller's phone number and the customer's name.
    operations:
      - { action: BOOK, operationId: agentCreateBooking }
      - { action: LIST, operationId: agentListBookings }
      - { action: CANCEL, operationId: agentCancelBooking }
      - { action: RESCHEDULE, operationId: agentRescheduleBooking }
    inputs_from_context: [X-Call-Id, X-Caller-Number]
  search_knowledge:
    description: >
      Answer a general question (opening hours, parking, payment, directions)
      from the provider's approved answers. Give the caller's question as
      spoken. Speak `answer.text` as given; never add facts. Not for
      availability, prices of a resource, or bookings.
    operations:
      - operationId: agentKnowledgeSearch
    inputs_from_context: [X-Call-Id, X-Caller-Number]
  alternative_one_to_one:
    note: >
      FastMCP.from_openapi with a RouteMap selecting tag=Agent yields six tools
      (one per Agent operation) with no hand-written code. Acceptable, but the
      three-tool wrapper above is preferred for a small conversational model.

paths:

  # ===========================================================================
  # AGENT FACADE — the only surface the LLM sees
  # ===========================================================================

  /agent/availability-search:
    post:
      tags: [Agent]
      operationId: agentAvailabilitySearch
      security: [{ oauth2: [agent] }]
      summary: Find resources, sessions and bookable slots from the caller's own words
      description: >
        RULE: a search covers at most TENANT_SEARCH_MAX_DAYS (31) days; a longer
        range is shortened and a note says so.
        The single discovery call. Accepts any combination of resource name,
        category, need text and time preference, all as spoken.
        RULE: run the safety check first (tenant red-flag lexicon); if it fires,
        return routing.action=TRANSFER_EMERGENCY and nothing else.
        RULE: resolve identity over the whole directory before applying any
        date or availability filter, so ambiguity survives.
        RULE: never return an empty list for a failure; set outcome=COULD_NOT_CHECK.
        RULE: resolve relative time words ("tomorrow", "next Tuesday", "evening")
        server-side in the facility timezone; the LLM must not do calendar math.
      x-mcp:
        expose: true
        tool: find_availability
        inject_headers: [X-Call-Id, X-Caller-Number]
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallerNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilitySearchRequest' }
            examples:
              namedResourceTomorrowEvening:
                summary: Named resource, relative date, day part, spoken in Kannada
                value:
                  utterance: "ನಾಳೆ ಸಂಜೆ ಡಾಕ್ಟರ್ ಗರಿಮಾ ಇರ್ತಾರಾ"
                  language: kn
                  resourceName: "Dr Garima"
                  when: { expression: "tomorrow evening" }
              needFirst:
                summary: Need only, ASR-damaged
                value:
                  utterance: "I need a zoologist appointment for kidney stones scanning"
                  language: en
                  needText: "kidney stones scanning"
                  when: { expression: "today" }
              categoryGender:
                summary: Category plus preference
                value:
                  utterance: "lady doctor for thyroid"
                  language: en
                  category: "thyroid doctor"
                  preferences: { gender: FEMALE }
                  when: { expression: "today" }
      responses:
        '200':
          description: Understood meaning, routing decision, sessions with bookable slots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilitySearchResponse' }
              example:
                outcome: FOUND
                asOf: "2026-09-25T17:02:11+05:30"
                routing: { action: OFFER_SLOTS }
                understood:
                  resources:
                    - { resourceId: res_garima, name: "Dr. Garima", confidence: 0.94, matchedOn: NAME_PHONETIC }
                  categories: []
                  dates: { from: "2026-09-26", to: "2026-09-26" }
                  dayPart: EVENING
                clarification: null
                results:
                  - resource:
                      resourceId: res_garima
                      name: "Dr. Garima"
                      localizedNames: { kn: "ಡಾ. ಗರಿಮಾ", hi: "डॉ. गरिमा" }
                      categories: [ { id: cat_genmed, name: "General Medicine", localizedNames: { kn: "ಸಾಮಾನ್ಯ ವೈದ್ಯಕೀಯ", hi: "सामान्य चिकित्सा" } } ]
                      gender: FEMALE
                      price: { amount: 600, currency: INR, confirmed: true }
                      dataConfirmed: true
                    sessions:
                      - sessionId: ses_res_garima_2026-09-26_2
                        date: "2026-09-26"
                        label: Afternoon
                        start: "15:00"
                        end: "17:00"
                        status: SCHEDULED
                        timingCertainty: EXPECTED
                        presence: null
                        capacityModel: SEQUENCE
                        capacity: { total: 12, booked: 3, remaining: 9 }
                        arriveBy: "16:45"
                        bookable: true
                        notBookableReason: null
                        slots:
                          - { slotId: slot_ses_res_garima_2026-09-26_2_04, kind: SEQUENCE, position: 4, expectedWindow: { from: "15:30", to: "15:40" }, available: true }
                          - { slotId: slot_ses_res_garima_2026-09-26_2_05, kind: SEQUENCE, position: 5, expectedWindow: { from: "15:40", to: "15:50" }, available: true }
                          - { slotId: slot_ses_res_garima_2026-09-26_2_06, kind: SEQUENCE, position: 6, expectedWindow: { from: "15:50", to: "16:00" }, available: true }
                    unavailable: []
                alternatives: []
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /agent/bookings:
    post:
      tags: [Agent]
      operationId: agentCreateBooking
      security: [{ oauth2: [agent] }]
      summary: Reserve one slot for one customer
      description: >
        RULE: slots more than TENANT_BOOKING_HORIZON_DAYS (180) ahead are refused (400).
        Atomically reserves the slot. RULE: if the slot was taken or the session
        changed since it was offered, return 409 SLOT_UNAVAILABLE with the
        session's current bookable slots so the agent can re-offer without a
        second search. RULE: one call per customer; two customers on one phone are
        two calls with two Idempotency-Keys. RULE: the response contains
        everything the agent needs to close the call (resource, date, window,
        arriveBy, confirmationCode). Status is BOOKED, which means a slot is
        held; timing remains an expectation unless timingCertainty=CONFIRMED.
      x-mcp:
        expose: true
        tool: manage_booking
        action: BOOK
        inject_headers: [X-Call-Id, X-Caller-Number, Idempotency-Key]
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallerNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentBookRequest' }
            example:
              slotId: slot_ses_res_garima_2026-09-26_2_04
              customer: { name: "Lakshmi R", phone: "9876543210", relationToCaller: SELF }
              reasonVerbatim: "ಮೊಣಕಾಲು ನೋವು ಎರಡು ವಾರದಿಂದ"
              language: kn
      responses:
        '201':
          description: Slot reserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentBooking' }
              example:
                outcome: BOOKED
                bookingId: bkg_0192
                confirmationCode: "4471"
                status: BOOKED
                customer: { name: "Lakshmi R", phone: "9876543210" }
                resource: { resourceId: res_garima, name: "Dr. Garima", localizedNames: { kn: "ಡಾ. ಗರಿಮಾ" } }
                category: { id: cat_genmed, name: "General Medicine" }
                date: "2026-09-26"
                session: { sessionId: ses_res_garima_2026-09-26_2, label: Afternoon, start: "15:00", end: "17:00" }
                slot: { slotId: slot_ses_res_garima_2026-09-26_2_04, kind: SEQUENCE, position: 4, expectedWindow: { from: "15:30", to: "15:40" } }
                arriveBy: "16:45"
                timingCertainty: EXPECTED
                price: { amount: 600, currency: INR, confirmed: true }
                resourceToday: null
        '200':
          description: Idempotent replay.
          headers:
            Idempotent-Replay: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentBooking' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/SlotConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }
    get:
      tags: [Agent]
      operationId: agentListBookings
      security: [{ oauth2: [agent] }]
      summary: Bookings belonging to the caller's phone number
      description: >
        Scoped by X-Caller-Number (matches the booking phone or the number the
        booking was made from). RULE (tenant disclosure policy, default
        NAME_REQUIRED): if more than one customer is registered under the number
        and customerName is absent, return outcome=NAME_REQUIRED with
        customersOnNumber and no names. RULE: each item embeds the resource's
        current session state so "is my doctor coming?" is one call.
      x-mcp:
        expose: true
        tool: manage_booking
        action: LIST
        inject_headers: [X-Call-Id, X-Caller-Number]
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallerNumber'
        - name: customerName
          in: query
          schema: { type: string, maxLength: 100 }
        - name: phone
          in: query
          description: Only when the caller number is absent (landline) or the caller booked under another number. Read-only; cancel/reschedule on a spoken number is refused by default.
          schema: { $ref: '#/components/schemas/Phone' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Bookings (possibly none).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentBookingList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /agent/bookings/{bookingId}/cancel:
    post:
      tags: [Agent]
      operationId: agentCancelBooking
      security: [{ oauth2: [agent] }]
      summary: Cancel the caller's booking
      description: >
        RULE: succeeds only when X-Caller-Number matches the booking phone or the
        booked-from number AND customerName matches. Any mismatch returns the
        same neutral 404 as a non-existent booking. Releases the slot.
        RULE: a booking that is already cancelled returns 200 unchanged with
        outcome ALREADY_CANCELLED; its status says whether the customer or the
        provider cancelled it.
      x-mcp:
        expose: true
        tool: manage_booking
        action: CANCEL
        inject_headers: [X-Call-Id, X-Caller-Number, Idempotency-Key]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallerNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerName]
              properties:
                customerName: { type: string, maxLength: 100 }
                reasonVerbatim: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentBooking' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /agent/bookings/{bookingId}/reschedule:
    post:
      tags: [Agent]
      operationId: agentRescheduleBooking
      security: [{ oauth2: [agent] }]
      summary: Move the caller's booking to another slot
      description: >
        Same verification as cancel. newSlotId comes from find_availability and
        may belong to a different resource. Atomic: old slot released and new
        slot reserved together, or nothing changes (409 SLOT_UNAVAILABLE).
      x-mcp:
        expose: true
        tool: manage_booking
        action: RESCHEDULE
        inject_headers: [X-Call-Id, X-Caller-Number, Idempotency-Key]
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallerNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerName, newSlotId]
              properties:
                customerName: { type: string, maxLength: 100 }
                newSlotId: { type: string }
      responses:
        '200':
          description: Rescheduled. Response includes previous slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentBooking' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SlotConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  # ===========================================================================
  # DIRECTORY — who exists, in every language the callers use
  # ===========================================================================

  /agent/knowledge-search:
    post:
      tags: [Agent]
      operationId: agentKnowledgeSearch
      security: [{ oauth2: [agent] }]
      summary: Answer a caller's general question from approved answers only
      description: >
        Deterministic retrieval over the knowledge base's question variants (any
        language or script, normalised and transliterated like the resolver).
        RULE: run the red-flag check first; if it fires, return
        routing.action=TRANSFER_EMERGENCY and nothing else.
        RULE: answer only above the tenant's answer threshold and clearly ahead
        of the runner-up; between the clarify and answer thresholds return
        CLARIFICATION_NEEDED with up to three options; below, NO_ANSWER. Never
        compose or translate an answer: `answer.language` says which approved
        text was returned.
        RULE: never NO_ANSWER for a failure; set outcome=COULD_NOT_CHECK.
        WHY: in healthcare an improvised answer is a risk; the provider signs off
        every sentence the agent may speak.
      x-mcp:
        expose: true
        tool: search_knowledge
        inject_headers: [X-Call-Id, X-Caller-Number]
      parameters:
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/CallerNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeSearchRequest' }
            example: { question: "ಪಾರ್ಕಿಂಗ್ ಇದೆಯಾ", language: kn }
      responses:
        '200':
          description: An approved answer, a clarification, or no answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeSearchResponse' }
              example:
                outcome: ANSWERED
                asOf: "2026-09-26T10:02:11+05:30"
                routing: { action: ANSWER }
                answer:
                  entryId: kb_parking
                  topic: parking
                  text: "ಹೌದು. ನೆಲಮಾಳಿಗೆಯಲ್ಲಿ ಉಚಿತ ಪಾರ್ಕಿಂಗ್ ಇದೆ; ಮುಖ್ಯ ದ್ವಾರದ ಪಕ್ಕದ ರಸ್ತೆಯಿಂದ ಒಳಗೆ ಬನ್ನಿ."
                  language: kn
                  source: CURATED
                  confidence: 1.0
                  matchedQuestion: "ಪಾರ್ಕಿಂಗ್ ಇದೆಯಾ"
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /knowledge:
    get:
      tags: [Knowledge]
      operationId: listKnowledge
      summary: Knowledge entries (approved and drafts)
      security: [{ oauth2: [knowledge.write] }]
      parameters:
        - { name: topic, in: query, schema: { type: string } }
        - { name: approved, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Entries, by topic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Knowledge]
      operationId: createKnowledgeEntry
      summary: Add an answer (draft unless approved)
      description: RULE the agent sees only approved entries, from its next question on (every replica).
      security: [{ oauth2: [knowledge.write] }]
      parameters:
        - $ref: '#/components/parameters/ActingUser'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeEntryInput' }
            example:
              topic: parking
              questions: ["is there parking", "ಪಾರ್ಕಿಂಗ್ ಇದೆಯಾ", "पार्किंग है क्या"]
              answers: { en: "Yes. Free parking is in the basement.", kn: "ಹೌದು. ನೆಲಮಾಳಿಗೆಯಲ್ಲಿ ಉಚಿತ ಪಾರ್ಕಿಂಗ್ ಇದೆ." }
              approved: true
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeEntry' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /knowledge/{entryId}:
    parameters:
      - { name: entryId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Knowledge]
      operationId: updateKnowledgeEntry
      summary: Replace an answer; the agent sees the change on its next question
      security: [{ oauth2: [knowledge.write] }]
      parameters:
        - $ref: '#/components/parameters/ActingUser'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeEntryInput' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeEntry' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Knowledge]
      operationId: deleteKnowledgeEntry
      summary: Remove an answer
      security: [{ oauth2: [knowledge.write] }]
      parameters:
        - $ref: '#/components/parameters/ActingUser'
      responses:
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /categories:
    get:
      tags: [Directory]
      operationId: listCategories
      summary: Categories with localized names
      description: Tenant-static; cacheable (ETag). offersBookings=false means never offer or route.
      responses:
        '200':
          description: Categories.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /categories/{categoryId}:
    put:
      tags: [Directory]
      operationId: upsertCategory
      summary: Create or replace a category (admin, onboarding)
      description: Idempotent by id. RULE the agent sees the change on its next question (every replica).
      security: [{ oauth2: [directory.write] }]
      parameters:
        - { name: categoryId, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9_]+$', maxLength: 50 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
            example: { code: DERM, name: Dermatology, localizedNames: { kn: "ಚರ್ಮರೋಗ ವಿಭಾಗ" }, offersBookings: true }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /resources:
    get:
      tags: [Directory]
      operationId: listResources
      summary: Resource directory (staff and web; the agent uses availability-search)
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Resources.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Resource' }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Directory]
      operationId: createResource
      summary: Add a resource (admin)
      security:
        - oauth2: [directory.write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /resources/{resourceId}:
    get:
      tags: [Directory]
      operationId: getResource
      summary: One resource with schedule template summary
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Resource.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Directory]
      operationId: updateResource
      x-rules: ["When a resource stops being offered (active=false or bookingPolicy=NOT_OFFERED), its future live bookings become NEEDS_RESCHEDULE with a SESSION_CANCELLED notification each."]
      summary: Update a resource (admin). Sets dataConfirmed when the hospital signs off.
      security:
        - oauth2: [directory.write]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /lexicon:
    get:
      tags: [Directory]
      operationId: listLexicon
      summary: Multilingual terms the resolver uses
      description: >
        WHY: callers say "skin doctor", "ಚರ್ಮ ವೈದ್ಯ", "charm ka doctor", "thyroid
        doctor". The hospital decides what each maps to (e.g. thyroid → General
        Medicine, not endocrinology). Entries are approved before use.
        RED_FLAG entries drive the emergency check. Unapproved entries are
        ignored by the resolver.
      security:
        - oauth2: [directory.write]
      parameters:
        - name: conceptType
          in: query
          schema: { $ref: '#/components/schemas/LexiconConceptType' }
        - name: language
          in: query
          schema: { $ref: '#/components/schemas/Language' }
        - name: approved
          in: query
          schema: { type: boolean }
